# tests/dropin/compose.mk.yml — Phase 13-2 (#367) overlay.
#
# project name は base (tests/dropin/compose.yml) と同じ `mk-dropin` を書いておく
# (#804 follow-up、#3373)。単体で使われても project 名がディレクトリ名にならない。
#
# 使い方 (リポジトリ直下から):
#   docker compose \
#     -f tests/dropin/compose.yml \
#     -f tests/dropin/compose.mk.yml up -d --build
#
# このオーバーレイは `app-a` (Misskey TS) を mk-go ビルドに差し替える。
# postgres-a / redis-a / nginx-a / instance B 系列はベースから引き継ぐので、
# nginx-a の upstream (`app-a:3000`) はそのまま mk-go を指す。
#
# Phase 13-1 (TS-A only) と Phase 13-2 (mk-A) の両方で `app-a` というサービス
# 名を維持しているのは、nginx config が `upstream a_backend { server app-a:3000; }`
# のようにハードコードしているため。サービス名を変えると nginx config も書き
# 換える必要があり、TS↔mk swap シナリオの外科性が損なわれる。

name: mk-dropin

services:
  app-a:
    # 既存 TS image を上書きする (compose merge ルールで image / build /
    # entrypoint が overlay 側に置き換わる)。
    image: ""
    build:
      context: ../..
      # 既存の federation 用 Dockerfile を再利用する。migrate と server を
      # 両方ビルドし、entrypoint で migrate up → server start する構成。
      # mk-go のマイグレーションは TS schema に対して原則追加のみ。例外は 17 件
      # あり、うち 13 件は mk-go が自分で作ったものの除去・初期化か upstream 追随。
      # 残る 4 件のうち TS が書いた行を消すのは 000081 と 000094。000081 が
      # 消すのは renoteId を失って表示されなくなった空殻だけ、000094 は
      # user_ip の表記揺れを畳んで 1 行に統合する (観測そのものは失われない)。
      # 000084 / 000085 は meta の未設定行を埋めるだけ
      # (docs/migration-from-ts.md#破壊的なマイグレーション)。
      dockerfile: tests/federation/common/Dockerfile.mkgo
    environment:
      # Go 標準 trust store に dropin 用 self-signed cert を読ませる。
      # gen-certs.sh が生成する bundle.pem には a / b の両 cert が入っている。
      SSL_CERT_FILE: /certs/bundle.pem
      TZ: Asia/Tokyo
    volumes:
      - ./instance_a_mk.yml:/app/.config/default.yml:ro
      - certs:/certs:ro
    # mk-go の /healthz は GET なので TS の healthcheck (POST /api/ping) と
    # 命令が違う。差し替え後は GET /healthz で healthy を判定する。
    # distroless image (#621) には wget が無いので binary 自身に -healthcheck
    # フラグを通して叩かせる (cmd/misskey の -healthcheck mode)。
    healthcheck:
      test: ["CMD", "/app/misskey", "-healthcheck", "-config", ".config/default.yml"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres-a:
        condition: service_healthy
      redis-a:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
