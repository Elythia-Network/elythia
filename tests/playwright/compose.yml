# tests/playwright/compose.yml — #744 Phase 1 PR-1
#
# Playwright e2e 基盤の最小構成。mk-go 単体 + postgres + redis + Playwright
# runner で API/streaming を target に spec を実行する。frontend は本 PR
# では bundle しない (= cypress dropin と同じ API 中心構成、page.goto は
# 後続 PR で frontend bundling を追加するときに導入する)。
#
# 使い方:
#   docker compose -f tests/playwright/compose.yml up -d --build
#   docker compose -f tests/playwright/compose.yml --profile test \
#     run --rm playwright-runner
#   docker compose -f tests/playwright/compose.yml down -v

# project name は repo dir 名 (default = `mk`) と衝突して UDS 本番の
# `mk-postgres-1` / `mk-redis-1` / `mk-mkgo-1` container を取り合うので、
# 明示的に別 project に分離する。これにより `make playwright-down -v` でも
# UDS service は touch されない。
name: mk-playwright

services:
  postgres:
    # バックアップの image (Dockerfile の backup stage) と同じ digest に揃える。固定しないと、
    # 本家がマイナー版を出したときに、バックアップの spec がその版と image の版のずれで
    # PR と関係なく落ちる (#4152)。backup stage を上げたら手で揃える
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    environment:
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: pg_isready -U misskey
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [playwright]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: redis-cli ping
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [playwright]

  mkgo:
    build:
      context: ../..
      # tests/federation/common/Dockerfile.mkgo は migrate + server を両方
      # build して entrypoint で migrate up を走らせる。Playwright phase 1
      # は federation 不要なので最小 binary 起動 + migrate up で十分。
      dockerfile: tests/federation/common/Dockerfile.mkgo
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./instance.yml:/app/.config/default.yml:ro
      # 管理画面のバックアップの保存先 (#4072)。目印のファイルだけがあり、世代は無い。
      # 取得・検証・復元は別のサービス (backup-daemon) が要り、このスタックには無い。
      # 書き込めるのは、削除とダウンロードの spec (admin_backup) が、runner から
      # 世代のファイルを置いて叩き、削除で消すため (#4093)。runner は同じ
      # ディレクトリを /work/backup-fixture として見る
      - ./backup-fixture:/backup
    healthcheck:
      test: ["CMD", "/app/elythia", "healthcheck", "-config", ".config/default.yml"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [playwright]

  # 分割アップロード (drive/files/create-chunked/*) の照合のための S3 互換のストレージ
  # (#4093)。分割アップロードは S3 の multipart upload で組み立てるので、ローカルの
  # 保存先では CHUNKED_UPLOAD_UNAVAILABLE になる。mkgo は普段ローカルに保存し、
  # drive_chunked の spec が admin/update-meta でここへ向け、終わったら戻す。
  # image は internal/core/backupadmin/minio_test.go と同じもの (Docker Hub の
  # minio/minio は repository が無くなった)
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-secret
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    # 分割アップロードの spec は、保存先をこの名前で指す。ファイルの url はこのホストから
    # 作られ、/api.json の照合 (ajv の url 書式) はドットの無いホストを受けない
    networks:
      playwright:
        aliases:
          - minio.local

  # バケットを作るだけで終わる。spec の側で作ると、S3 の署名を runner に持ち込むことになる
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    entrypoint: ["sh", "-c", "mc alias set pw http://minio:9000 minioadmin minioadmin-secret && mc mb --ignore-existing pw/drive"]
    depends_on:
      minio: {condition: service_healthy}
    networks: [playwright]

  # nginx TLS proxy (#817 part2)。
  # Browser の WebAuthn API は secure context (HTTPS) を要求するため、
  # mk-go (HTTP 3000) の前に nginx を立てて self-signed cert で HTTPS
  # terminate する。Playwright runner は `ignoreHTTPSErrors: true` で
  # cert chain の validation を bypass する。
  # `mkgo.local` alias を nginx に付与して、WebAuthn の RPID 検証も
  # 同時に通す (= `.` を含む hostname、go-webauthn が要求)。
  nginx-tls:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    depends_on:
      mkgo: {condition: service_healthy}
    networks:
      playwright:
        aliases:
          - mkgo.local

  # Playwright runner. profiles: [test] で `up -d` の対象から外し、
  # 明示的に `--profile test run` で起動する (cypress runner と同 pattern)。
  playwright-runner:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      # mkgo backend への接続先。spec から fixtures 経由で参照する。
      # nginx TLS proxy (`mkgo.local` alias) 経由で HTTPS で叩く (#817 part2)。
      # WebAuthn は secure context が必須なため。`ignoreHTTPSErrors` を
      # playwright config 側で立て、self-signed cert を accept する。
      MK_BASE_URL: https://mkgo.local
      # Node global WebSocket (streaming spec が使う) は WHATWG 準拠で
      # `rejectUnauthorized` option がない。env で TLS verify を bypass
      # する (= test 環境のみ、self-signed cert を accept する目的)。
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      # spec ファイルと playwright.config.ts は test 実行時に変更されること
      # があるので bind mount で読み込む。生成物 (test-results/) は host に
      # 残るので gitignore で除外する。
      - .:/work
      # bind mount が image 焼き付けの /work/node_modules を上書きしないよう
      # anonymous volume で保護する。これにより npm install (Dockerfile.runner)
      # の結果が container 内で生き続ける。
      - /work/node_modules
    working_dir: /work
    depends_on:
      mkgo: {condition: service_healthy}
      # nginx-tls は MK_BASE_URL=https://mkgo.local の解決先。
      nginx-tls: {condition: service_started}
      # drive_chunked の spec が使う
      minio-init: {condition: service_completed_successfully}
    networks: [playwright]

networks:
  playwright:
    driver: bridge
