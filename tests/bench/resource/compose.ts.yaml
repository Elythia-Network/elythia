# Resource consumption comparison stack for Misskey TS (upstream submodule).
#
# Intended to run alongside the UDS mk-go stack (compose.uds.yaml) so that
# `docker stats` can compare memory / CPU / storage between mk-go and TS
# under "just started" conditions.
#
# - postgres: 18-alpine (matches mk-go's pg version)
# - redis:    7-alpine (upstream-default)
# - web:      built from third_party/misskey (submodule, 2026.5.1-mk.x)
#
# Project name is separated so it does not collide with the running mk-go
# stack. Only the web port is exposed on the host (13000) and nginx is
# intentionally omitted -- nginx resource usage is excluded from the
# comparison per the bench spec.

name: mk-bench-ts

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: testpass
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misskey -d misskey"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bench-ts
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bench-ts
    restart: unless-stopped

  web:
    image: mk-bench-ts-web:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
    volumes:
      - ./default.yml:/misskey/.config/default.yml:ro
      - misskey_files:/misskey/files
    ports:
      - "13000:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://localhost:3000/api/ping',
          r => process.exit(r.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks:
      - bench-ts
    restart: unless-stopped

networks:
  bench-ts:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  misskey_files:
