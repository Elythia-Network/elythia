# docker-compose.playwright.ts.yml — #744 Phase 1 TS validation overlay.
#
# project name は base (docker-compose.playwright.yml) の `name: mk-playwright`
# を引き継ぐ。overlay 単独で起動することはないので明示は不要。
#
# spec は upstream Misskey TS の API 互換挙動を期待値として書いている。
# 本 overlay は backend を `misskey/misskey:2026.10.0` に置き換えて、上流の
# 真の挙動で spec が pass することを baseline として確認する。
# (mk-go 単体 stack は docker-compose.playwright.yml、両者で同 spec が
# pass = drop-in 互換が保証される、という設計。)
#
# 使い方:
#   docker compose \
#     -f docker-compose.playwright.yml \
#     -f docker-compose.playwright.ts.yml up -d --build
#   docker compose \
#     -f docker-compose.playwright.yml \
#     -f docker-compose.playwright.ts.yml --profile test \
#     run --rm playwright-runner
#
# Service name `mkgo` は base から引き継ぎ (= playwright runner の env も
# 変えなくて済む)。中身は TS image に置き換える形。

services:
  mkgo:
    # mk-go の追従先と同じ版に揃える。spec の selector は mk-go 同梱
    # frontend (2026.10.0-mk.x) 基準で書かれているので、ここが古いと
    # UI spec が TS 側だけ落ちる (#2276)。MisskeyVersion を上げるときは
    # この tag も一緒に上げること。
    image: misskey/misskey:2026.10.0
    build: !reset null
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      TZ: Asia/Tokyo
      # upstream RateLimiterService は `NODE_ENV !== 'production'` で
      # `disabled = true` になる (packages/backend/src/server/api/RateLimiterService.ts)。
      # mk-go 側は instance.yml の `disableEndpointRateLimits: true` で off に
      # したが TS 側は同 flag を解釈しないので、NODE_ENV を上書きして全 off
      # にする。production image は build 済 dist/ を起動するので NODE_ENV を
      # 'test' に変えても起動経路は同じで、frontend bundle も built 済を
      # 使う (= 実 production と同 build)。spec が verify する API shape /
      # UI 動作には影響しない。
      NODE_ENV: test
      # ただし upstream の scripts/compile_config.js は NODE_ENV==='test' の
      # とき `.config/test.yml` を読みに行く。ここで mount しているのは
      # default.yml だけなので、指定が無いと config が compile されないまま
      # `built/.config.json` 不在で migration が落ちて container が exit 1
      # する (= stack 起動失敗)。MISSKEY_CONFIG_YML があれば NODE_ENV に
      # 関係なくそのファイルを読むので、rate limit 無効化の意図を保ったまま
      # config を解決できる (#2276)。
      MISSKEY_CONFIG_YML: default.yml
    volumes:
      # mk-go base と config を共有 (instance.yml は両 backend 互換)。
      # mk-go base の mount path は /app/.config/default.yml だが、TS image は
      # /misskey/.config/default.yml で読むので path だけ overlay で書き換え。
      - ./tests/playwright/instance.yml:/misskey/.config/default.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:3000/api/ping | grep -q pong"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Playwright runner に「TS backend で実行中」と伝える marker。spec 側は
  # process.env.MK_BACKEND_TYPE で TS 限定の skip 等を制御する (#882 で
  # import-zip async download が TS の got HTTPS で self-signed cert を
  # 弾く問題への workaround)。
  playwright-runner:
    environment:
      MK_BACKEND_TYPE: ts
