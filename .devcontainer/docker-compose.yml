services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    network_mode: host
    environment:
      # **MK_* をここに増やさないこと。** viper で設定ファイルより優先されるので、
      # internal/config のテストが fixture ではなくこの値を読んで落ちる。
      # 既に MK_DB_USER / MK_DB_PASS が TestLoad_DatabaseConfig を、
      # MK_REDIS_HOST が TestLoad_RedisForPubsub を落としている (計 2 件)。
      # devcontainer 内でだけ再現し CI では起きないので気付きにくい。
      # TestLoad_RedisConfig は fixture の値がたまたま localhost なので通って
      # いるだけで、host network をやめて MK_REDIS_HOST: redis にすると 3 件目
      # になる。
      # Go アプリ用 DB 接続
      MK_DB_HOST: localhost
      MK_DB_PORT: "5432"
      MK_DB_DB: misskey
      MK_DB_USER: misskey
      MK_DB_PASS: misskey
      MK_REDIS_HOST: localhost
      MK_REDIS_PORT: "6379"
      # テスト用 DB 接続 (CI と同じ形式)
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: misskey
      TEST_DB_USER: misskey
      TEST_DB_PASS: misskey
      TEST_DB_SSLMODE: disable
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: "6379"
      # `elythia migrate` は DATABASE_URL を読まない。-config (既定 .config/default.yml)
      # を必ず読むので、**設定ファイルが無いと MK_DB_* があっても起動しない**
      # (MK_DB_* はファイルの値を上書きするだけ)。複製は postCreate.sh が行う。

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: misskey
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host

volumes:
  pgdata:
