# project name を別に分離 (#804 follow-up)。default `mk` だと UDS 本番の
# container 群と衝突するので明示的に切る。
name: mk-federation

services:
  # ── Certificate Generator ──────────────────────────────────
  certs:
    image: alpine:3.21
    command: >
      sh -c "apk add --no-cache openssl >/dev/null 2>&1 && /gen-certs.sh"
    volumes:
      - certs:/certs
      - ./tests/federation/common/gen-certs.sh:/gen-certs.sh:ro

  # ── mk-go Instance ─────────────────────────────────────────
  postgres-mkgo:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: pg_isready -U misskey
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - federation

  redis-mkgo:
    image: redis:7-alpine
    healthcheck:
      test: redis-cli ping
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - federation

  app-mkgo:
    build:
      context: .
      dockerfile: tests/federation/common/Dockerfile.mkgo
    environment:
      # Self-signed cert バンドルを Go トラストストアに読ませる。
      # Go の crypto/x509 は Linux 上で SSL_CERT_FILE を honor する。
      SSL_CERT_FILE: /certs/bundle.pem
      TZ: Asia/Tokyo
    depends_on:
      postgres-mkgo:
        condition: service_healthy
      redis-mkgo:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
      - ./tests/federation/common/mkgo.yml:/app/.config/default.yml:ro
    # distroless image (#621) には wget が無いので binary 自身に -healthcheck
    # フラグを通して叩かせる (cmd/misskey の -healthcheck mode)。
    healthcheck:
      test: ["CMD", "/app/misskey", "-healthcheck", "-config", ".config/default.yml"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - federation

  nginx-mkgo:
    image: nginx:alpine
    volumes:
      - ./tests/federation/common/nginx-mkgo-ssl.conf:/etc/nginx/nginx.conf:ro
      - certs:/certs:ro
    depends_on:
      app-mkgo:
        condition: service_healthy
    networks:
      federation:
        aliases:
          - mkgo

  # ── Misskey Instance ───────────────────────────────────────
  postgres-mk:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: pg_isready -U misskey
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - federation

  redis-mk:
    image: redis:7-alpine
    healthcheck:
      test: redis-cli ping
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - federation

  misskey-app:
    image: misskey/misskey:2026.10.0
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      postgres-mk:
        condition: service_healthy
      redis-mk:
        condition: service_healthy
    volumes:
      - ./tests/federation/misskey/misskey.yml:/misskey/.config/default.yml:ro
    networks:
      - federation

  nginx-mk:
    image: nginx:alpine
    volumes:
      - ./tests/federation/misskey/nginx-misskey-ssl.conf:/etc/nginx/nginx.conf:ro
      - certs:/certs:ro
    depends_on:
      misskey-app:
        condition: service_started
      # certs は one-shot コンテナなので start ではなく完了を待たないと
      # /certs/misskey.crt が無いまま nginx が起動してクラッシュする
      # (Devin #366 で同種 race を発見し dropin と同時に修正)。
      certs:
        condition: service_completed_successfully
    networks:
      federation:
        aliases:
          - misskey

  # ── Test Runner ────────────────────────────────────────────
  test-runner:
    profiles: ["test"]
    build:
      context: ./tests/federation
      dockerfile: common/Dockerfile
    environment:
      MKGO_URL: https://mkgo
      MISSKEY_URL: https://misskey
      MKGO_DOMAIN: mkgo
      MISSKEY_DOMAIN: misskey
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./tests/federation:/tests:ro
    working_dir: /tests/misskey
    depends_on:
      nginx-mkgo:
        condition: service_started
      nginx-mk:
        condition: service_started
      app-mkgo:
        condition: service_healthy
    networks:
      - federation

volumes:
  certs:

networks:
  federation:
    driver: bridge
