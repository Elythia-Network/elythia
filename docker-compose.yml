# ログの上限 (#2828)。
#
# **既定の json-file はローテーションしない。** 指定しないとコンテナが動いている
# あいだログが増え続け、ディスクを埋める。
#
# **`max-size` は decimal。** json-file は units.FromHumanSize で読むので、`50m` は
# 50,000,000 バイト (= 47.7 MiB)。`50mib` と書いても同じ扱いで、MiB は表現できない。
# 3 世代で 1 サービスあたり最大 150 MB (= 143 MiB)。実測 (mk-go の本番) では
# 1 日あたり約 13 MB なので、封筒の分を含めて 1 週間前後は遡れる。
#
# **既存のコンテナには効かない。** この設定は生成時に固定されるので、
# `docker compose up -d` で作り直すまで反映されない。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  app:
    logging: *default-logging
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 新規構築では DB が空なので、app 起動前に migration の完走を待つ。
      migrate:
        condition: service_completed_successfully
    environment:
      # ビルド済みフロントエンド (SPA) の配信元。下の volumes で host の
      # `frontend/built` を /frontend に bind-mount し、ここを指す。
      # static-assets / twemoji / fluent-emoji / repo-assets は image に焼き込み
      # 済み (Dockerfile 参照) なので mount 不要。service worker (_sw_dist_) は
      # MISSKEY_FRONTEND_DIR の親ディレクトリから自動解決される。
      MISSKEY_FRONTEND_DIR: /frontend/_frontend_vite_
      MISSKEY_FRONTEND_DIST_DIR: /frontend/_frontend_dist_
      MISSKEY_CLIENT_ASSETS_DIR: /client-assets
      TZ: Asia/Tokyo
    volumes:
      # コンテナは UID/GID 991 (Misskey TS 互換) で起動するので、
      # ./files は UID 991 が書き込める所有権でなければならない (#621)。
      # 旧 root 構成から upgrade する場合は一度
      # `sudo chown -R 991:991 ./files` を実行すること。
      - ./files:/app/drive-files
      # ビルド済みフロントエンド成果物。起動前に host で `make e2e-frontend-build`
      # を実行して `frontend/built/{_frontend_vite_,_frontend_dist_,
      # _sw_dist_}` を生成しておくこと。約 200MB あるため image には焼き込まず
      # mount で渡す (UDS 版 compose と同方針)。これが無いと SPA の JS/CSS が
      # 404 になりフロントエンドが表示されない。
      - ./frontend/built:/frontend:ro
      # client assets (バブルゲーム / フラッシュ等が参照)。
      - ./frontend/packages/frontend/assets:/client-assets:ro
      # 設定ファイルを上書きする場合 (cp .config/docker.yml.example
      # .config/docker.yml して編集後にコメントを外す):
      # - ./.config/docker.yml:/app/.config/default.yml:ro
      # バックアップの保存先をディレクトリにするときは、管理画面 (#3462) が読む
      # ので、backup サービスと同じホストのパスを同じ場所に mount する。本体は
      # GID 991 のグループとして読む (docs/backup.md の「ディレクトリ」)。
      # - /mnt/nas/elythia-backup:/backup
    restart: unless-stopped

  # DB マイグレーションを適用する one-shot サービス。新規構築では DB が空のため、
  # これが完走しないと app は `relation "meta" does not exist` 等で機能しない。
  # app と同じ image を使い、command を `elythia migrate` に差し替える。
  # golang-migrate は適用済み version を schema_migrations で管理するので、TS から
  # swap した既存 DB に対しても追加テーブルのみを冪等に適用する (data loss なし)。
  migrate:
    logging: *default-logging
    build: .
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/app/elythia"]
    command: ["migrate", "-config", ".config/default.yml", "-direction", "up"]
    # app 側で設定ファイルを volume mount で上書きする場合は、migrate にも同じ
    # mount を設定して同一の DB 接続先を参照させること。
    # volumes:
    #   - ./.config/docker.yml:/app/.config/default.yml:ro
    restart: "no"

  db:
    logging: *default-logging
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: misskey
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misskey"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    logging: *default-logging
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # DB のバックアップ (#3458)。**普段は動かさない** (profiles に入れてあるので
  # `docker compose up` では起動しない)。使うときだけ呼ぶ:
  #   docker compose run --rm --no-deps backup take    # 取って保存先へ送る
  #   docker compose run --rm --no-deps backup list    # 保存先の世代を一覧する
  #   docker compose run --rm --no-deps backup verify latest  # 使い捨ての PostgreSQL へ戻して確かめる
  #   docker compose run --rm --no-deps backup restore ...  # 戻す (docs/deployment.md)
  # 本体の image は pg_dump を持たないので、postgres:18-alpine に elythia を足した
  # image (Dockerfile の target backup) で動かす。設定は本体と同じファイルを読む
  # (db: と backup: の節)。保存先と暗号化の設定は docs/backup.md を参照。
  # **同じホストのディスクはバックアップに数えない。** 保存先は S3 互換か、別の
  # 機器を mount したディレクトリにする。docker.sock は渡さない。
  backup: &backup-service
    logging: *default-logging
    build:
      context: .
      target: backup
      # meta.json の elythiaCommit に入る revision。Dockerfile の中では git を呼べない
      # ので build-arg で渡す (docs/backup.md)。
      args:
        MKGO_COMMIT: ${MKGO_COMMIT:-}
    profiles: ["backup"]
    # depends_on を書かない。書くと `run` が DB のコンテナの設定の差分を見て作り直す
    # ことがある。DB は動いている前提で、`run --no-deps` で呼ぶ。
    # 本体 (GID 991) と同じグループを補助グループに持つ。ディレクトリの保存先で、
    # 根に付けた setgid を作ったディレクトリに残し、本体が一覧・ダウンロード・
    # 削除できるようにするため (docs/backup.md の「ディレクトリ」)。
    group_add:
      - "991"
    volumes:
      - ./.config/docker.yml:/app/.config/default.yml:ro
      # 保存先をディレクトリにするときは、別の機器を mount したホストのパスを渡し、
      # backup.storage.dir.path に /backup を書く。コンテナは UID 70 (postgres) で
      # 動く。根の所有者とグループを 70:991、mode を 2770 にする (docs/backup.md)。
      # - /mnt/nas/elythia-backup:/backup
      # 保存先をディレクトリにするときは、mount 先の根に目印 .elythia-backup が要る
      # (mount が外れたときにホストのディスクへ書かないため。docs/backup.md)。
      # db.extra.sslrootcert で CA ファイルを指すときは、同じパスに mount する。
      # - /etc/elythia/db-ca.crt:/etc/elythia/db-ca.crt:ro
      # 暗号化した世代を確かめる・戻すときだけ、age の秘密鍵を渡す (取るだけなら不要)。
      # 秘密鍵はリポジトリの外 (.config にも置かない) に置き、取る側のホストには
      # 置かないのが望ましい。
      # - /etc/elythia/backup-identity.txt:/run/secrets/backup-identity.txt:ro
    restart: "no"

  # バックアップを常駐させる形 (#3460)。上の backup と同じ image・volumes で、
  # `elythia backup daemon` を動かす。設定の backup.schedule の間隔で取って・確かめて・
  # 古い世代を消し、失敗・食い違い・遅れを backup.notify へ知らせる。手順は
  # docs/backup.md の「定期実行」。使うときだけ profile を有効にする:
  #   docker compose --profile backup-daemon up -d backup-daemon
  # backup と別のサービスにしているのは、backup が `run --rm` で呼ぶ 1 回きりの
  # もの (restart: "no") で、常駐には restart: unless-stopped が要るため。名前が
  # 固定なので、本体の backup.server.serviceUrl に http://backup-daemon:3010 と書ける。
  # 制御 API (backup.schedule.listen) は compose の内部ネットワークだけで待ち受け、
  # **ports を書かない** (TLS を持たない)。
  backup-daemon:
    <<: *backup-service
    profiles: ["backup-daemon"]
    command: ["daemon"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # backup.schedule.at はこのタイムゾーンで読む。
      TZ: Asia/Tokyo
    restart: unless-stopped

  # Video thumbnail generator (#637 M2). mk-go の media proxy が video/* を
  # 受けたとき、設定 `videoThumbnailGenerator` で指定した URL に対して
  # multipart POST (default mode) で video bytes を送り、静止画 thumbnail
  # を返してもらう。app コンテナとは Docker network 内で通信し、公開
  # ポートは持たない (origin 側は mk-go の /proxy 経由でしか到達しない)。
  #
  # default では disabled。動画サムネを生成したい operator は以下を
  # コメントアウト解除し、加えて .config/docker.yml の
  # `videoThumbnailGenerator: http://video-thumb:8005` も有効化する。
  # 設定が無ければ mk-go は video request に dummy PNG を返すだけで
  # 外部 generator を呼ばない。
  #
  # 互換 image: ghcr.io/nekonoverse/video-thumb (POST /thumbnail multipart)。
  # Misskey TS 互換の GET 経路を使いたい場合は
  # `videoThumbnailGeneratorMode: get` を設定し、対応 image
  # (`GET /thumbnail.webp?thumbnail=1&url=<URL>`) に差し替える。
  #video-thumb:
  #  logging: *default-logging
  #  image: ghcr.io/nekonoverse/video-thumb:unstable
  #  restart: unless-stopped

volumes:
  db_data:
  redis_data:
