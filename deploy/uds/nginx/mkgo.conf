events {
    worker_connections 1024;
}

http {
    # mk-go が /run/mkgo/mkgo.sock に作る UNIX domain socket を upstream にする。
    # TCP は一切使わない (Phase 12-1 で入れた UDS listen の実運用デプロイ参照)。
    upstream mkgo {
        server unix:/run/mkgo/mkgo.sock;
        # mk-go への接続を使い回す(#3963)。無いと API や静的ファイルの要求のたびに
        # UDS の接続を張って閉じ、mk-go が接続の受け入れとバッファの確保をやり直す。
        # 32 は nginx の worker 1 つあたりに残す待機中の接続の上限で、mk-go 側に
        # 常駐する goroutine もこの数まで。待機中の接続は keepalive_timeout の
        # 既定(60 秒)で nginx が閉じる。mk-go の IdleTimeout(120 秒、
        # internal/server/server.go の serverIdleTimeout)より短いので、mk-go が
        # 先に閉じた接続へ nginx が要求を送る形にはならない。
        keepalive 32;
    }

    # WebSocket の要求にだけ `Connection: upgrade` を付け、それ以外は空にする(#3963)。
    # Upgrade の無い要求に `Connection: upgrade` を付けるのは HTTP の意味として
    # 誤りなので、upstream の keepalive と合わせて直した。接続の使い回し自体は
    # keepalive と `Connection` の明示で効く(upgrade を付けたままでも mk-go は
    # 接続を閉じなかった。隔離した nginx 1.27 と mk-go で確かめた)。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ファイルアップロードのデフォルト上限 (mk-go の maxFileSize 250MB) に合わせて
    # 余裕を持って 512M にしておく。小さすぎると drive アップロードが 413 で落ちる。
    client_max_body_size 512M;

    # /streaming の WebSocket 接続が切れないようにアイドルタイムアウトを長めに。
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;

    # access/error ログは docker logs でそのまま見えるよう stdout/stderr に流す。
    #
    # **Origin を記録する (#2953)。** 既定の combined は Referer しか持たず、
    # `Referrer-Policy` 次第で越境のブラウザでも `-` に落ちるため、
    # 「越境の Web クライアントが実在するか」を確定できない。CORS を絞る変更の
    # 前後で実数を比較できるようにしておく。Origin はブラウザが付けるヘッダで
    # 個人を識別しないので、combined に 1 項目足すだけにとどめる。
    # **クエリ文字列を記録しない ($request ではなく $uri を使う)。**
    #
    # 同梱フロントは WebSocket を `/streaming?i=<token>` で開く
    # (misskey-js の streaming.ts)。`i` はスコープ制限のないネイティブ
    # ログイントークンなので、`$request` (= リクエスト行そのもの、クエリ込み)
    # を出すと**ログを読めるだけでアカウントを乗っ取れる**。mk-go 側は
    # `internal/misc/redact` がアクセスログと Sentry の両方でこれを伏せて
    # いるのに、同梱の参照設定だけが素通しだった。
    #
    # `$uri` は正規化後のパスでクエリを含まない。デバッグ性は `$request` より
    # 落ちるが、クエリに credential が載る設計である以上ここは削るしかない。
    log_format mkgo '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" origin="$http_origin"';
    access_log /dev/stdout mkgo;

    # **error_log にはクエリが残る。** nginx はエラー行に
    # `request: "<リクエスト行>"` と `upstream: "<URI>"` を付けるので、
    # 上の log_format でアクセスログから落としても、**`/streaming?i=<token>` は
    # ここから平文で出る**。実測 (本番の直近 168 時間): 4 行、いずれも mk-go の
    # 再起動中に WebSocket が来たときの `[crit]` で、`error_log ... crit;` に
    # 下げても消えない。`make uds-update` のたびに踏む形。
    #
    # **nginx 側に redaction の手段は無い。** 取れる選択肢は
    #   (a) 収集側でフィルタする (推奨。docker logs を直接読まず、
    #       `request: "[^"]*"` を落とすパイプを挟む)
    #   (b) `error_log /dev/null;` にして診断性を捨てる
    #   (c) トークンをクエリに載せない構成へ移る (クライアント側の変更が要る)
    # のいずれか。ここでは診断性を優先して (a) を前提に残している。
    error_log /dev/stderr;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # /files/<accessKey> は mk-go LocalStorage の生バイナリ配信。nginx
        # proxy buffering の default (8 x 4k or 8k) では大きい animated
        # WebP / GIF が ~32KB 付近で truncate される事象 (#730) を回避する
        # ため buffering を off にして mk-go の Stream をそのまま流す。
        # WebSocket は使わない経路なので Upgrade ヘッダも不要。
        # Connection を空にするのは upstream の keepalive を効かせるため(#3963)。
        # 指定しないと nginx は `Connection: close` を送り、要求ごとに接続を閉じる。
        location /files/ {
            proxy_pass http://mkgo;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_redirect off;
        }

        # 管理画面からのバックアップのダウンロード (#3462、ディレクトリの保存先)。
        # 数 GB の dump を返すので、/files/ と同じく buffering を切る。切らないと
        # nginx が応答を一時ファイルに書き出し、ディスクを dump の大きさだけ使う。
        # Connection を空にする理由は /files/ と同じ(#3963)。
        location = /backup-download {
            proxy_pass http://mkgo;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_redirect off;
        }

        # pprof を外部へ出さない。mk-go は enablePprof=true のときだけ
        # /debug/pprof/* を生やすが、その判断は運用者が診断のために行うもので、
        # 公開してよいという意味ではない。`location /` が全部を委譲する構成なので、
        # ここで明示的に落とさないと有効化した瞬間に外から runtime 内部が見える。
        # 診断は UDS へ直接 (curl --unix-socket) 行う。
        location /debug {
            return 404;
        }

        # **`/metrics` も塞ぐ。** mk-go は `enableMetrics` を有効にすると
        # 無認証で公開する。`docs/configuration.md` と `docs/divergence/operations.md` が
        # 「無認証公開なので LB / nginx の ACL 必須」と書いているのに、同梱の
        # 参照設定にその対策が無く、有効化した運用者がそのまま外部へ晒すこと
        # になっていた。収集は UDS へ直接 (curl --unix-socket) 行う。
        location /metrics {
            return 404;
        }

        # 静的ファイルも API も全部 mk-go に委譲する。nginx 側でパスを二重管理しない。
        # WebSocket upgrade も同じ location で拾う。Connection は上の map で、
        # WebSocket のときだけ upgrade、それ以外は空(keepalive を効かせる)にする。
        location / {
            proxy_pass http://mkgo;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_redirect off;
        }
    }
}
