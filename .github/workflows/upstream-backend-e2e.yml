name: Upstream backend e2e

# Misskey 本家の backend e2e (third_party/misskey の test/e2e/**) を mk-go に
# 向けて実行し、API 互換性の regression を検知する。
#
# テスト本体には一切手を入れず、submodule 側の vitest 設定 2 ファイル
# (globalSetup = mk-go バイナリの起動、setupFiles = /api/reset-db) だけを
# 差し替えている。上流でテストが増えれば自動的に検証対象も増える。
#
# 『通らないことが正しい』テストは tests/upstream-e2e/known-divergences.json に
# 根拠付きで登録し、vitest の expected-failure (task.fails) として扱う。skip では
# ないので、乖離が解消して通るようになったテストは逆に落ちて一覧の陳腐化に
# 気付ける。
#
# - pull_request: paths に該当する変更のみ。**branch protection の required
#   checks には入れない**ので、落ちても merge はブロックされない。実行に
#   4 シャード並列でも 4 分前後かかるうえ、1200 件超のテストで flaky 要素が
#   あるため merge ブロッカーには適さない
# - workflow_dispatch: upstream 追従で submodule を bump したときに手動で発火できる
#
# 非ブロッキングを `continue-on-error: true` で実現しないこと。あれは job を
# 成功扱いにするので失敗が完全に不可視になる。job は正しく失敗させ、required
# に入れないことで非ブロッキングにする (dropin-e2e.yml と同じ判断)。

on:
  pull_request:
    branches: [develop, main]
    # backend の挙動・DB schema・e2e ハーネスを触る変更だけを対象にする。
    # frontend / ドキュメントのみの PR で 20 分待たされないようにする。
    paths:
      - "internal/**"
      - "cmd/**"
      - "migration/**"
      - "tests/upstream-e2e/**"
      - "third_party/misskey"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/upstream-backend-e2e.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to test"
        required: false
        default: "develop"

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # シャード分割で 1 job あたりのテストが 1/4 になったので枠を縮めた
    # (45 → 20)。Go / pnpm のビルドはシャードごとに重複するので、その分は
    # 割り算されない。上流でテストが増えることを見込んで余裕は残す。
    timeout-minutes: 20

    # **プロセス内では並列にできない。** upstream の vitest 設定が
    # `maxWorkers: 1` で、かつ setupFiles がファイルごとに mk-go の
    # `/api/reset-db` (全テーブル truncate) を叩く。同じ DB に 2 ファイルを
    # 並行させると片方が相手のフィクスチャを実行中に消す。
    #
    # 並列度はシャードごとに job を分けて稼ぐ (#2609)。job が別なら
    # PostgreSQL / Redis の service container も別に立つので、DB の共有が
    # 起きない。fail-fast: false で 1 シャードが落ちても他は完走させる
    # (どのシャードが落ちたかで原因の当たりが付く)。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    # ポートは本家 .github/misskey/test.yml に合わせる。tests/upstream-e2e/mkgo.yml
    # がこの番号を向いているので、compose 版 (make upstream-e2e-up) と CI で
    # 同じ設定ファイルを使い回せる。
    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d test-misskey"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 56312:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request では github.ref が refs/pull/<n>/merge になるので PR の
          # 内容が checkout される。workflow_dispatch のときだけ inputs.ref。
          ref: ${{ inputs.ref || github.ref }}
          # test/e2e/** と vitest 設定は submodule 側にある。
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm のバージョンは submodule 側 package.json の packageManager から
          # 取る。mk リポジトリ直下には package.json が無いので、既定のまま
          # だと "No pnpm version is specified" で落ちる。
          package_json_file: third_party/misskey/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: third_party/misskey/.node-version
          cache: pnpm
          cache-dependency-path: third_party/misskey/pnpm-lock.yaml

      # pnpm install / misskey-js build / test config の生成をまとめて行う。
      # ローカルの `make upstream-e2e` と同じ経路を通すため、個別 step に
      # 展開せず Makefile 側に集約する。
      - name: Prepare misskey workspace
        run: make upstream-e2e-deps

      - name: Apply migrations
        run: make upstream-e2e-migrate

      - name: Run upstream backend e2e
        run: make upstream-e2e-test VITEST_ARGS="--shard=${{ matrix.shard }}/4"

      # 失敗時は mk-go 側のログを artifact 化する。vitest の出力だけでは
      # 「サーバーが何を返したか」が分からないことが多い。
      - name: Upload mk-go log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-e2e-mkgo-log-${{ matrix.shard }}
          path: /tmp/mkgo-upstream-e2e.log
          if-no-files-found: ignore
          retention-days: 14
