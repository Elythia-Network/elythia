name: Playwright

# #744 Phase 1 の Playwright spec を TS image + mk-go の両 backend に対して
# 実行し、drop-in shape drift / 連動 endpoint の regression を検知する。
#
# nightly (schedule) から PR トリガーへ移行した (#2291)。nightly は失敗に
# 気づくのが翌日になるうえ、1 日分のマージがまとまってどの変更が壊したか
# 特定しづらい。実際 #2276 では 3 ヶ月間赤のまま放置され、しかも TS job は
# spec を 1 件も実行していなかった。
#
# - pull_request: paths に該当する変更のみ。**branch protection の required
#   checks には入れない**ので、落ちても merge はブロックされない
# - workflow_dispatch: 任意の ref に対して手動実行可能
#
# 非ブロッキングを `continue-on-error: true` で実現しないこと。あれは job を
# 成功扱いにするので失敗が完全に不可視になり、上記の「3 ヶ月間緑のまま spec
# 0 件」を招いた実装そのもの。job は正しく失敗させ、required に入れないことで
# 非ブロッキングにする。
#
# TS backend は workflow_dispatch 専用 (plan job で matrix を切り替え)。これは
# 暫定措置ではなく、**upstream 追従のタイミングだけ回す**という運用上の決定
# (docs/upstream-catch-up.md「submodule bump 後に必須: TS baseline で
# Playwright を回す」)。
#
# TS baseline の価値は「spec が mk-go の挙動を正解として書かれていないか」を
# 検出する一点にあり、upstream が変わらない限り答えも変わらないので、nightly や
# PR で常時回す意味は薄い。実測でも同一 CI 環境・同一 spec の所要時間は
# mk-go と TS で差が無く (TS/mk-go の中央値 0.94)、速度面の情報も得られない。
#
# 失敗時 (timeout 含む) は playwright test-results + docker compose logs を
# artifact 化する。

on:
  pull_request:
    branches: [develop, main]
    # backend の API 形状・DB schema・spec 自体・起動まわりを触る変更だけを
    # 対象にする。ドキュメントのみの PR で待たされないようにする。
    paths:
      - "internal/**"
      - "cmd/**"
      - "migration/**"
      - "tests/playwright/**"
      - "third_party/misskey"
      - "docker-compose.playwright*.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/playwright.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to test"
        required: false
        default: "develop"

permissions:
  contents: read

jobs:
  # matrix を event ごとに切り替えるための前段 job。
  #
  # `jobs.<job_id>.if` は matrix context を参照できない (参照できるのは
  # github / needs / vars / inputs) ため、「TS entry だけ pull_request で
  # 除外する」を job 単位の if では書けない。一方 `jobs.<job_id>.strategy` は
  # needs を参照できるので、ここで include 配列そのものを出力して差し替える。
  #
  # matrix.exclude は静的にしか書けず、matrix の軸を式にしても include entry は
  # 「既存 combination に merge できなければ新規 combination を作る」semantics
  # なので TS が復活してしまう。include 全体を式にするのが唯一の方法。
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          # シャード数。spec は 1 スタックあたり直列でしか回せない
          # (共有 root アカウント / instance meta のため) ので、並列度は
          # 「スタックごと分ける」= シャード数でしか稼げない。
          SHARD_TOTAL: "4"
        # backend 固有の make target / compose 引数 / prepull / timeout を
        # ここで一元定義する (= matrix.include の単一の情報源)。
        run: |
          mkgo='{
            "backend": "mk-go",
            "up_target": "playwright-up",
            "test_target": "playwright-test",
            "down_target": "playwright-down",
            "compose_args": "-f docker-compose.playwright.yml",
            "prepull": "",
            "timeout_minutes": 25,
            "continue_on_error": false
          }'
          # prepull: upstream image を先取りで pull しておく。compose up と
          # 並列化するため `&` で background 化したい誘惑があるが、Actions の
          # run step は step 終了で shell が exit するため継続が保証されない。
          # foreground で待ち、compose up 内の同 image pull を daemon cache
          # hit (0s) にする方が確実。version は
          # docker-compose.playwright.ts.yml と sync させること。
          #
          # continue_on_error: TS backend は upstream 追従時に手動で回して
          # 差分を洗い出すための道具なので、赤でも他 job を巻き込まない。
          # 失敗内容は artifact (trace / screenshot) から読む。
          ts='{
            "backend": "ts",
            "up_target": "playwright-ts-up",
            "test_target": "playwright-ts-test",
            "down_target": "playwright-ts-down",
            "compose_args": "-f docker-compose.playwright.yml -f docker-compose.playwright.ts.yml",
            "prepull": "docker pull misskey/misskey:2026.9.1",
            "timeout_minutes": 45,
            "continue_on_error": true
          }'
          # TS backend は upstream 追従のタイミングだけ回す運用なので、
          # pull_request では matrix から落とす (#2291 / #2289)。
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            backends=$(jq -c -n --argjson a "$mkgo" '[$a]')
          else
            backends=$(jq -c -n --argjson a "$mkgo" --argjson b "$ts" '[$a, $b]')
          fi
          # backend x shard の直積を作る (#2609)。
          #
          # **shard を matrix の軸として書かない。** `include` は既存の
          # combination に merge できない entry を新規 combination として
          # 足す semantics なので、軸と併用すると backend 側の絞り込み
          # (pull_request で TS を落とす) が壊れる。include 配列そのものを
          # 直積にして渡すのが唯一の方法。
          matrix=$(jq -c -n --argjson bs "$backends" --argjson n "$SHARD_TOTAL" \
            '[$bs[] as $b | range(1; $n + 1) | $b + {shard: ., shard_total: $n}]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  spec:
    name: spec (${{ matrix.backend }} ${{ matrix.shard }}/${{ matrix.shard_total }})
    needs: plan
    runs-on: ubuntu-latest
    # backend ごとに枠を変える。mk-go は hang を早く検出したいので短め。
    # TS は #2288 で初めて spec が走った際 45 min で 360/370 までしか進まず
    # timeout したため、分割前は 90 min にしていた。
    #
    # 念のため: この差は backend の速度差ではない。同一 CI 環境で両方が成功した
    # 同一 spec 263 件を突き合わせると所要時間はほぼ同じ (TS/mk-go の中央値
    # 0.94)。TS 側が伸びたのは 77 件の失敗が retry され、成功時 1 秒台の spec が
    # 10-20 秒の timeout 待ちに化けたため。
    #
    # その 77 件は環境要因だったと確定した (#2289)。ローカルで健全な TS backend
    # に対して全 438 spec を完走させたところ 434 pass / 3 fail / 1 skip・12.1 min
    # で、落ちた 3 件はいずれも別種の spec 側の問題だった (修正済み)。CI 側の
    # 77 件は追わない。
    # シャード分割で 1 job あたりの spec 数が 1/4 になったので、枠も
    # 縮めた (mk-go 45 → 25 / TS 90 → 45)。hang の検出を遅らせないため。
    # frontend build が cache miss する submodule bump 時 (5-10 min) と
    # スタック起動 (2 min) を見込んでも余裕がある。
    timeout-minutes: ${{ matrix.timeout_minutes }}

    strategy:
      fail-fast: false
      # include の中身は plan job が event ごとに組み立てる。backend 固有の
      # make target / compose 引数 / prepull / timeout はそちらで一元定義して
      # いるので、各 step は条件分岐なしで `${{ matrix.* }}` を展開するだけ。
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    # matrix entry の continue_on_error を job に反映する。true だと
    # その backend が落ちても workflow 全体は success になる。TS は
    # workflow_dispatch でしか回らず、人が結果を見る前提なので true でよい。
    # PR で常時回す backend に対しては絶対に true にしないこと。
    continue-on-error: ${{ matrix.continue_on_error }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request では github.ref が refs/pull/<n>/merge になるので
          # PR の内容が checkout される。'develop' 固定のままだと PR の変更を
          # 一切見ずに develop をテストして常に緑になる (#2291)。
          ref: ${{ inputs.ref || github.ref }}
          # tests/federation/common/Dockerfile.mkgo が
          # third_party/misskey/built/ + assets/ を COPY するので、submodule
          # を先に展開しないと docker build が "failed to compute cache key:
          # ... not found" で死ぬ (#954 で frontend bundle COPY が追加されて
          # 2026-05-09 nightly から本問題が顕在化)。
          submodules: recursive

      # mk-go backend は Dockerfile.mkgo で third_party/misskey/built/
      # _frontend_vite_ / _frontend_dist_ / _sw_dist_ を COPY する。これらは
      # `pnpm build` の成果物で、submodule に commit されていない。CI で
      # 都度 build する (build context に焼き込んで docker build に渡す)。
      # TS overlay (upstream image を pull) では本 step を skip して時間を節約。
      #
      # actions/cache で built/ + node_modules を pin。submodule の
      # pnpm-lock.yaml hash をキーに使うので、Misskey upstream を pin し
      # 直さない限り cache hit で pnpm install + build をまるごと skip
      # (5-10 min → 数秒に短縮)。
      # **cache key は submodule の commit SHA で取る。** `pnpm-lock.yaml` の
      # hash だと、submodule のソースを変えても lock が動かない限り cache hit に
      # なり、**古い `built/` が使われる** (#2786 で実際に踏んだ。fork の
      # `boot.js` を直したのに CI では反映されず spec が落ちた)。
      - name: Resolve misskey submodule SHA
        id: misskey-sha
        run: echo "sha=$(git rev-parse HEAD:third_party/misskey)" >> "$GITHUB_OUTPUT"

      - name: Cache misskey workspace (built + node_modules)
        id: cache-misskey
        if: matrix.backend == 'mk-go'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # packages/*/node_modules で全 workspace package を glob 対応
          # (新 package 追加時に手動更新不要)。built/ は pnpm build の成果物。
          path: |
            third_party/misskey/node_modules
            third_party/misskey/packages/*/node_modules
            third_party/misskey/built
          key: misskey-workspace-${{ runner.os }}-${{ steps.misskey-sha.outputs.sha }}

      - name: Set up pnpm
        if: matrix.backend == 'mk-go' && steps.cache-misskey.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm のバージョンは submodule 側 package.json の packageManager から
          # 取る。mk リポジトリ直下には package.json が無い。
          #
          # **corepack を使わない (#2914)。** Node.js 26 の配布物に corepack は
          # 含まれておらず、今動いているのは runner image にプリインストールされた
          # Node の corepack が PATH に残るからでしかない。image の Node が 26 に
          # なった時点で一斉に落ちる。
          #
          # **版は元から揃っていた。** corepack は packageManager の pin を尊重する
          # ので、`prepare pnpm@latest` を挟んでも workspace 内で走るのは 11.25.0
          # (実測)。ここで消えるのは corepack への依存と、使われない 12.x を毎回
          # ダウンロードしていた無駄。
          package_json_file: third_party/misskey/package.json

      - name: Set up Node.js
        if: matrix.backend == 'mk-go' && steps.cache-misskey.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: third_party/misskey/.node-version

      - name: Build third_party/misskey frontend bundle
        if: matrix.backend == 'mk-go' && steps.cache-misskey.outputs.cache-hit != 'true'
        working-directory: third_party/misskey
        # pnpm install --frozen-lockfile + pnpm build。初回は 5-10 分かかる
        # (vite + sw + twemoji asset 抽出)。docker build 時に build context
        # から COPY されるので、image build より前に host で run しておく。
        # 以降の nightly は cache hit で本 step を skip する。
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pre-pull image (TS only)
        if: matrix.prepull != ''
        run: ${{ matrix.prepull }}

      - name: Bring up stack
        run: make ${{ matrix.up_target }}

      - name: Run Playwright
        # spec は 1 スタックあたり直列でしか回せない。共有の root アカウント
        # を 298 ファイル中 179 がブラウザからサインインして使い (数え方は
        # `grep -rlE 'uiSigninAsRoot|signin-username' tests/playwright/specs --include='*.spec.ts' | wc -l`)、
        # さらに 32 がサインインせず root の token で API を叩く
        # (`root.json` を読むのが 211 で、その差分)。このアカウントと instance meta を全 spec が
        # 共有しており、Playwright のファイル並列だと `profile_iscat_toggle`
        # と `profile_isbot_toggle` が同じ alice を、`admin_branding_save` と
        # `about_page_render` が同じ meta を取り合う。並列度はスタックごと
        # 分ける = シャードでしか稼げない (#2609)。
        run: make ${{ matrix.test_target }} PLAYWRIGHT_ARGS="--shard=${{ matrix.shard }}/${{ matrix.shard_total }}"

      # spec が 1 件も実行されないまま "成功" になる状態を検知する。
      #
      # TS matrix は continue-on-error なので、stack 起動に失敗して spec を
      # 0 件しか回さなくても workflow は緑になる。実際 spec (ts) は 3 ヶ月間
      # spec 0 件のまま放置され、TS baseline としての機能を失っていた。
      #
      # cancelled (= job timeout) では走らせない。results.json は json reporter
      # が run 完了時にまとめて書くので、timeout で打ち切られると必ず不在に
      # なり、「spec が 0 件」という誤ったエラーで本来の timeout を覆い隠す
      # (#2289 で実際に踏んだ)。
      - name: Guard against zero specs executed
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          results=tests/playwright/results.json
          if [ ! -s "$results" ]; then
            echo "::error::playwright results.json が無い/空です (spec が 1 件も実行されなかった可能性)"
            exit 1
          fi
          count=$(jq '[.. | objects | select(has("tests")) | .tests[]] | length' "$results")
          echo "executed specs: $count"
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::spec が 1 件も実行されていません"
            exit 1
          fi

      # 失敗時のみ playwright test-results (trace / screenshot / video 含む)
      # を保存。video は popup menu / contextmenu / multi-step interaction
      # failure の debug 価値が高い。
      # cancelled でも回収する。job timeout は failure ではなく cancelled に
      # なるため `if: failure()` だと trace / screenshot が一切残らず、
      # 45 min timeout した TS job の失敗内容を追えなかった (#2289)。
      - name: Upload test-results on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ matrix.backend }}-${{ matrix.shard }}
          path: tests/playwright/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # 失敗時のみ docker compose logs を artifact 化して原因調査できる
      # ようにする。
      - name: Capture docker compose logs on failure
        if: failure() || cancelled()
        run: |
          mkdir -p /tmp/playwright-logs
          docker compose ${{ matrix.compose_args }} logs \
            > /tmp/playwright-logs/compose.log 2>&1 || true

      - name: Upload logs artifact on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-logs-${{ matrix.backend }}-${{ matrix.shard }}
          path: /tmp/playwright-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Final teardown
        if: always()
        run: make ${{ matrix.down_target }} >/dev/null 2>&1 || true

  # nightly が壊れたまま放置されるのを防ぐ。schedule 実行が失敗したときだけ
  # issue を起票し、既に open な同名 issue があれば何もしない (重複抑止)。
  # 手動 dispatch では起票しない。
  #
  # 背景: 本 workflow は最後の success から数十日以上 failure が続いていたが、
  # PR の required check に入っておらず通知も無かったため気付かれなかった。
  # 原因を解消したら起票された issue を close すること (次回失敗時に再起票)。
