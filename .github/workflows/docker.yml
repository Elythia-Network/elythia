name: Docker

# GHCR (ghcr.io/<owner>/<repo>) にメインの runtime image を publish する。
#
# - develop / main への push と `v*` タグ push で実 push する。
# - PR では build だけ行って、動く Dockerfile かどうかを検証する (push はしない)。
#
# image 名は `${{ github.repository }}` をそのまま使うので、upstream では
# `ghcr.io/shiroha-a/mk`、fork では `ghcr.io/nananek/mk-go` になる。

on:
  push:
    branches: [main, develop]
    # このリポジトリのリリースタグは `1.1.1` 形式で `v` 接頭辞を付けない。
    # `v*` だけだと一度も一致せず、リリースを打ってもバージョン付き image が
    # publish されない状態だった (1.0.0 / 1.1.0 が GHCR に存在しなかった)。
    # 将来 `v` 付きで打たれても拾えるよう両方を条件に残す。
    tags: ["[0-9]+.[0-9]+.[0-9]+", "v*"]
  pull_request:
    branches: [main, develop]
  # push 済みのタグから image を publish し直すための入口。
  #
  # `--ref <tag>` では実行できない。workflow_dispatch は **dispatch 対象の ref に
  # あるファイル** に定義されている必要があり、過去のタグが指すコミットには
  # このトリガーが無いため。したがって develop に対して実行し、ビルドしたい
  # タグは tag input で渡す。
  #
  #   gh workflow run docker.yml -f tag=1.1.1
  #
  # タグを打ち直すのは破壊的なので、取りこぼしはこちらで拾う。
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. 1.1.1). Empty = build the branch."
        required: false
        default: ""

# ghcr.io に push するには packages: write が必要。
# contents: read は checkout 用。
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tag input が指定されていればそのタグを、無ければ通常どおり
          # イベントの ref を build する。
          ref: ${{ inputs.tag || github.ref }}
          # third_party/misskey (packages/backend/assets など) がDockerfileの
          # COPY対象になるため、submoduleを取得しないとbuildが失敗する。
          submodules: recursive
          # この job は GHCR へ publish する (packages: write)。後続は git の
          # 認証を使わない (submodule はこの step の中で取り終える) ので、
          # token を `.git/config` に残して pnpm install の lifecycle script
          # などから読める状態にしない。
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm のバージョンは submodule 側 package.json の packageManager から
          # 取る。mk リポジトリ直下には package.json が無い。
          #
          # **corepack を使わない (#2914)。** Node.js 26 の配布物に corepack は
          # 含まれておらず、今動いているのは runner image にプリインストールされた
          # Node の corepack が PATH に残るからでしかない。image の Node が 26 に
          # なった時点で一斉に落ちる。
          #
          # **版は元から揃っていた。** corepack は packageManager の pin を尊重する
          # ので、`prepare pnpm@latest` を挟んでも workspace 内で走るのは 11.25.0
          # (実測)。ここで消えるのは corepack への依存と、使われない 12.x を毎回
          # ダウンロードしていた無駄。
          package_json_file: third_party/misskey/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: third_party/misskey/.node-version

      # Dockerfileが /twemoji (本家frontendの絵文字SVG set) をCOPYするが、
      # その実体は third_party/misskey/packages/backend/node_modules/@misskey-dev/emoji-assets/built/twemoji
      # 配下にあり、pnpm install 後にしか存在しない。runner上で事前にinstallして
      # Docker build contextに含める (issue #359)。
      - name: Install third_party/misskey node_modules
        working-directory: third_party/misskey
        run: |
          pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # PR の場合は push しないので login 不要。fork からの PR で secrets が
      # 使えないケースでも build だけは回せるようにしておく。
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag 付けルール:
      #   - branch 名 (develop / main)
      #   - `sha-<shortsha>` (immutable 参照用)
      #   - git tag (v* 押した時)
      #   - `latest` (default branch = develop への push 時)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # tag input 指定時は「過去のタグを後追いで publish する」用途なので、
          # 可変タグ (latest / ブランチ名 / sha) を一切動かさない。dispatch は
          # default branch 上で走るため、gate しないと latest と develop が
          # 古いビルドで上書きされる。sha- は github.sha (= dispatch 時点の
          # develop HEAD) から作られるので、中身と食い違う偽ラベルにもなる。
          tags: |
            type=ref,event=branch,enable=${{ inputs.tag == '' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short,enable=${{ inputs.tag == '' }}
            type=raw,value=latest,enable=${{ inputs.tag == '' && github.ref_name == github.event.repository.default_branch }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Misskey rewritten in Go
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA の cache backend を使って layer を再利用し、build 時間を短縮する。
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # フロントエンドアセットを同梱した bundled image。pull しただけで起動できる
  # (docker-compose.image.yml / make image-up が使う)。
  #
  # 既存の build-and-push job とは独立している。あちらは従来どおり
  # `Dockerfile` からアセット非同梱の image を作るので、既存のビルド&起動
  # フローには影響しない。
  #
  # アセットは fork が publish する専用 image から COPY するため、この job は
  # submodule も pnpm install も必要としない (= 既存 job のような事前準備が
  # 一切要らない)。
  build-and-push-bundled:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # publish する job なので認証情報を残さない (build-and-push と同じ理由)。
          persist-credentials: false
        # submodule は不要。Dockerfile.bundled は third_party/misskey を参照せず、
        # アセットを assets image から取る。

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Dockerfile.bundled の assets image は `<tag>@sha256:<digest>` で固定して
      # いる。BuildKit は digest を優先して tag を見ないので、**tag だけ上げて
      # digest を取り直し忘れると、新しい tag を名乗る古い frontend が焼き込まれる**。
      # `make submodulepin-check` は tag しか突き合わせられない (ネットワークを
      # 使わない) ので、registry に問い合わせるのはここで行う。
      # fork 側が同じ tag を publish し直した場合もここで落ちる (= 中身が変わった
      # ことに気付ける)。
      #
      # **過去タグの再 publish (`-f tag=1.1.1`) では digest が無いのが正しい。**
      # digest の併記はこの検査より後に入ったので、既存リリースタグの
      # Dockerfile.bundled は tag だけを持つ。そこで落とすと冒頭の「取りこぼしは
      # こちらで拾う」経路が bundled だけ塞がる。tag input があって digest が
      # 無いときは照合を skip して warning を出す (タグを打ち直すのは破壊的なので、
      # 当時の Dockerfile のまま焼くしかない)。tag input が無いのに digest が
      # 無いのは pin の付け忘れなので落とす (bundled_assets_pin_test と同じ判定)。
      - name: Assets image digest matches its tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^ARG MISSKEY_ASSETS_IMAGE=//p' Dockerfile.bundled)
          if [ -z "$ref" ]; then
            # 過去タグは ARG の書き方自体が違いうる。照合できないだけで build は
            # 当時の Dockerfile のまま成立するので、tag input のときは落とさない。
            if [ -n "$INPUT_TAG" ]; then
              echo "::warning::$INPUT_TAG の Dockerfile.bundled から MISSKEY_ASSETS_IMAGE を読めなかった。digest の照合を skip する"
              exit 0
            fi
            echo "::error::Dockerfile.bundled から MISSKEY_ASSETS_IMAGE を読めなかった" >&2
            exit 1
          fi
          image=${ref%@*}
          pinned=${ref#*@}
          if [ "$image" = "$ref" ]; then
            if [ -n "$INPUT_TAG" ]; then
              echo "::warning::$INPUT_TAG の Dockerfile.bundled は assets image を digest で固定していない ($ref)。digest の照合を skip して当時の tag のまま build する"
              exit 0
            fi
            echo "::error::Dockerfile.bundled の MISSKEY_ASSETS_IMAGE ($ref) に digest が無い" >&2
            exit 1
          fi
          # --raw は manifest のバイト列そのものを返すので、その sha256 が digest になる。
          actual="sha256:$(docker buildx imagetools inspect --raw "$image" | sha256sum | cut -d' ' -f1)"
          echo "tag=$image pinned=$pinned registry=$actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::$image の digest が Dockerfile.bundled の pin と違う (pin: $pinned / registry: $actual)。tag を上げたなら digest も取り直すこと (docs/upstream-catch-up.md)" >&2
            exit 1
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 既存 image と同じリポジトリに `-bundled` suffix 付きで publish する。
          tags: |
            type=semver,pattern={{version}},suffix=-bundled
            type=semver,pattern={{major}}.{{minor}},suffix=-bundled
            type=sha,prefix=sha-,suffix=-bundled,format=short,enable=${{ inputs.tag == '' }}
            type=raw,value=bundled,enable=${{ inputs.tag == '' && github.ref_name == github.event.repository.default_branch }}
            type=raw,value=${{ inputs.tag }},suffix=-bundled,enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Misskey rewritten in Go (frontend assets bundled)
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.bundled
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
