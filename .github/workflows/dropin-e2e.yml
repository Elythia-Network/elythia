name: Drop-in e2e

# drop-in 互換の regression を検知する e2e を 4 シナリオ並列で実行する。
#
# - swap-test      (`make dropin-swap-test`)       TS→mk 切替の state preservation (#374)
# - mkgo-born      (`make dropin-mkgo-born-test`)  mk-go 生まれの DB を TS に
#                                                  引き渡せるか (#2379)
# - ed25519-verify (`make dropin-fedibird-test`)   Fedibird-like AP mock との
#                                                  Ed25519 双方向 verify (#1083)
# - federation     (`make federation-misskey-e2e`) 本物の Misskey TS を相手にした
#                                                  実連合 (follow / note / reaction /
#                                                  renote / reply / mention / delete)
#
# ed25519-verify は #2360 で追加した。Ed25519 署名は mk-go 独自の先行実装で、
# 他実装と本当に相互運用できるかは実際に喋らせないと分からない。ユニットテスト
# (48 件) は「自分で署名して自分で検証する」ことしか保証しない。
#
# mk-go 生まれの DB を TS が受け取れるかは **ロックインの有無そのもの**なので、
# swap-test とは別に載せる。swap-test の DB を作ったのは TypeORM なので、
# 「TS が一度も触っていない schema」は swap-test では一切踏まない。実際この経路の
# 初回実行で、RSA 秘密鍵が PKCS#1 のため TS 側の送信連合が全滅する不具合を
# 検出している (#2380)。
#
# なおこの target は導入時 (#1086) から 2 箇所壊れており、CI で回っていなかった
# ため約 3 か月間それに気付けなかった。載せる理由がまさにそれ。
#
# nightly (schedule) から PR トリガーへ移行した (#2291)。nightly は失敗に
# 気づくのが翌日になるうえ、1 日分のマージがまとまってどの変更が壊したか
# 特定しづらい。実測 5 分と安いので PR で回す。
#
# - pull_request: paths に該当する変更のみ。**branch protection の required
#   checks には入れない**ので、落ちても merge はブロックされない。federation
#   delivery 経路に flaky 要素があるため merge ブロッカーには適さない
# - workflow_dispatch: リリース前に手動で発火できる
#
# 非ブロッキングを `continue-on-error: true` で実現しないこと。あれは job を
# 成功扱いにするので失敗が完全に不可視になる。job は正しく失敗させ、required
# に入れないことで非ブロッキングにする。

on:
  pull_request:
    branches: [develop, main]
    # backend の挙動・DB schema・drop-in harness を触る変更だけを対象にする。
    # ドキュメントのみの PR で待たされないようにする。
    paths:
      - "internal/**"
      - "cmd/**"
      - "migration/**"
      - "tests/dropin/**"
      - "tests/federation/**"
      - "third_party/misskey"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "docker-compose.federation.misskey.yml"
      # drop-in stack の定義そのもの。ここが抜けていると compose を壊す変更で
      # workflow が**発火せず緑に見える**。frontend 用の
      # `docker-compose.dropin-frontend*.yml` は別 workflow の管轄なので含めない。
      - "docker-compose.dropin.yml"
      - "docker-compose.dropin.mk.yml"
      - "docker-compose.dropin.fedibird.yml"
      - ".github/workflows/dropin-e2e.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to test"
        required: false
        default: "develop"

permissions:
  contents: read

jobs:
  dropin:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 同じ stack (base + mk overlay) の上で走るシナリオを並列に回す。
    #
    # 既存 job にステップとして足すのではなく別 job にしているのは、swap が
    # 落ちた時点で ed25519 が回らなくなるのを避けるため。これらは実際に
    # 別々の壊れ方をする (fedibird 側は導入時から 2 箇所壊れていたのに、
    # swap が緑だったので 3 か月気付けなかった、#2360)。
    #
    # なお同じ compose project 名を共有する scenario 同士は**同一 runner 上では
    # 直列にしか回せない**が、matrix job はそれぞれ別 runner なので衝突しない。
    #
    # name    = check 一覧に出る表示名。何を検証しているかが分かるものにする
    # make    = 実行する make target。失敗時に手元で再現するコマンドそのもの
    # image   = 事前 pull する Misskey TS image (シナリオごとに版が違う)
    # compose = 失敗時の log 収集 / 撤去に渡す compose ファイル群
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: swap-test
            make: dropin-swap-test
            image: misskey/misskey:2026.9.1
            compose: -f docker-compose.dropin.yml -f docker-compose.dropin.mk.yml -f docker-compose.dropin.fedibird.yml
          - name: mkgo-born
            make: dropin-mkgo-born-test
            image: misskey/misskey:2026.9.1
            compose: -f docker-compose.dropin.yml -f docker-compose.dropin.mk.yml
          - name: ed25519-verify
            make: dropin-fedibird-test
            image: misskey/misskey:2026.9.1
            compose: -f docker-compose.dropin.yml -f docker-compose.dropin.mk.yml -f docker-compose.dropin.fedibird.yml
          - name: federation
            make: federation-misskey-e2e
            image: misskey/misskey:2026.9.1
            compose: -f docker-compose.federation.misskey.yml
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # schedule 起動時 inputs は空なので github.sha (= 既定ブランチ HEAD)
          # に落ちる。本 workflow は drop-in 互換 regression を nightly で
          # 監視するもので、`develop` への変更が対象なので明示的に develop を
          # 指定する (Devin #375 #1)。
          # pull_request では github.ref が refs/pull/<n>/merge になるので
          # PR の内容が checkout される。'develop' 固定のままだと PR の変更を
          # 一切見ずに develop をテストして常に緑になる (#2291)。
          ref: ${{ inputs.ref || github.ref }}
          # tests/federation/common/Dockerfile.mkgo が
          # third_party/misskey/built/ + assets/ を COPY するので submodule
          # を先に展開しないと docker build が "failed to compute cache key"
          # で死ぬ (#954 で frontend bundle COPY が追加され、2026-05-09
          # nightly から本問題が顕在化)。
          submodules: recursive

      # Dockerfile.mkgo が third_party/misskey/built/_frontend_vite_ 等を
      # COPY する。これは `pnpm build` の成果物で submodule に commit され
      # ていないので、docker build より前に host で run しておく。
      #
      # actions/cache で built/ + node_modules を pin (playwright.yml と同じ
      # 戦略)。submodule の pnpm-lock.yaml hash をキーに使うので、Misskey
      # upstream を pin し直さない限り cache hit で 5-10 min → 数秒に短縮。
      # **cache key は submodule の commit SHA で取る。** `pnpm-lock.yaml` の
      # hash だと、submodule のソースを変えても lock が動かない限り cache hit に
      # なり、**古い `built/` が使われる** (#2786 で実際に踏んだ。fork の
      # `boot.js` を直したのに CI では反映されず spec が落ちた)。
      - name: Resolve misskey submodule SHA
        id: misskey-sha
        run: echo "sha=$(git rev-parse HEAD:third_party/misskey)" >> "$GITHUB_OUTPUT"

      - name: Cache misskey workspace (built + node_modules)
        id: cache-misskey
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # packages/*/node_modules で全 workspace package を glob 対応
          # (新 package 追加時に手動更新不要)。built/ は pnpm build の成果物。
          path: |
            third_party/misskey/node_modules
            third_party/misskey/packages/*/node_modules
            third_party/misskey/built
          key: misskey-workspace-${{ runner.os }}-${{ steps.misskey-sha.outputs.sha }}

      - name: Set up pnpm
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm のバージョンは submodule 側 package.json の packageManager から
          # 取る。mk リポジトリ直下には package.json が無い。
          #
          # **corepack を使わない (#2914)。** Node.js 26 の配布物に corepack は
          # 含まれておらず、今動いているのは runner image にプリインストールされた
          # Node の corepack が PATH に残るからでしかない。image の Node が 26 に
          # なった時点で一斉に落ちる。
          #
          # **版は元から揃っていた。** corepack は packageManager の pin を尊重する
          # ので、`prepare pnpm@latest` を挟んでも workspace 内で走るのは 11.25.0
          # (実測)。ここで消えるのは corepack への依存と、使われない 12.x を毎回
          # ダウンロードしていた無駄。
          package_json_file: third_party/misskey/package.json

      - name: Set up Node.js
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: third_party/misskey/.node-version

      - name: Build third_party/misskey frontend bundle
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        working-directory: third_party/misskey
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pre-pull Misskey TS image
        # 旧版は `&` で background 化していたが、GitHub Actions の `run:`
        # step は step 終了で shell process が exit するため background
        # process の継続が runner 環境で保証されない (= pre-pull 効果が
        # 不確実)。foreground で完了を待ち、続く `make dropin-swap-test`
        # 内の同 image pull は docker daemon の cache hit で 0s で済む方が
        # 確実。playwright.yml (#816) と同じ判断。
        run: docker pull ${{ matrix.image }}

      # bash orchestrator + pytest を実行する。stage ログは標準出力に流れる。
      # 手元で再現するときも同じコマンドで良い。
      - name: Run make ${{ matrix.make }}
        run: make ${{ matrix.make }}

      # 失敗時のみ docker compose logs を artifact 化して原因調査できるようにする。
      # `if: failure()` で正常時はアップロードしない。
      - name: Capture docker compose logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/dropin-logs
          # drop-in 系は fedibird overlay も一緒に渡す。swap では使われないが、
          # 余分な -f は定義が増えるだけで害が無く、取りこぼさない方を優先する。
          #
          # ファイル名を `-post` で分けるのは、swap / mkgo-born の orchestrator が
          # trap 内で **同じ /tmp/dropin-logs へ ps.log / compose.log を書いてから
          # `down -v` する**ため。同名で書くとこの step が空ファイルで上書きして
          # しまい (stack はもう存在しない)、artifact から実ログが消える。
          # fedibird / federation は自前で診断を残さないので、この step だけが
          # 唯一の情報源になる。
          docker compose ${{ matrix.compose }} logs > /tmp/dropin-logs/compose-post.log 2>&1 || true
          docker compose ${{ matrix.compose }} ps   > /tmp/dropin-logs/ps-post.log 2>&1 || true

      - name: Upload logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # scenario ごとに分けないと、片方が失敗したときに artifact 名が
          # 衝突してアップロードが落ちる。
          name: dropin-logs-${{ matrix.name }}
          path: /tmp/dropin-logs/
          if-no-files-found: ignore
          retention-days: 14

      # cleanup は orchestrator の trap で済んでいるが、CI runner 上では
      # 念のため明示的に呼ぶ (orchestrator が timeout 等で trap が走らない
      # ケースに備えて)。
      - name: Final teardown
        if: always()
        run: |
          docker compose ${{ matrix.compose }} down -v >/dev/null 2>&1 || true
