name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# GITHUB_TOKEN の既定権限を最小化する。全jobはcheckout/build/testのみで
# リポジトリへの書き込みやPR/issueへの操作を行わないため、workflow直下で
# contents: readに絞れば全job分満たせる (jobごとの上書きは不要)。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # submodule の pointer が fork へ push 済みかを見る (#2845)。
      #
      # **required check で submodule を取っているものが 1 つも無い。** ci.yml で
      # `submodules: recursive` を指定しているのは frontend-check だけで、build /
      # test-shards / lint はいずれも取らない。submodule を取る他の workflow
      # (diff-e2e / playwright / upstream-backend-e2e / dropin-e2e / docker) も全て
      # 非 required。したがって pointer が未 push の SHA を指していても **required は
      # 全部緑のままマージでき**、develop に誰も解決できない pointer が載る。復旧は
      # その commit を持っている本人にしかできない。
      #
      # **`git ls-remote | grep` は使えない。** ls-remote が列挙するのは ref の
      # 先端だけなので、push 済みブランチの祖先 commit を取りこぼして誤検知する。
      # GitHub は SHA 指定の fetch を許可しているので、1 commit だけ shallow に
      # 取れるかで判定する (実測 1.8 秒 / 13 MB。未 push は
      # `upload-pack: not our ref` で exit 128)。
      #
      # 同 job の checkout は submodule を取らないが、gitlink の SHA は
      # `git ls-tree` で読めるので追加の取得は要らない。
      - name: Check submodule commit is pushed
        run: |
          set -euo pipefail
          path=third_party/misskey
          sha=$(git ls-tree HEAD "$path" | awk '{print $3}')
          if [ -z "$sha" ]; then
            echo "::error::$path の gitlink を読めませんでした。submodule の構成が変わったならこの step も直してください"
            exit 1
          fi
          url=$(git config -f .gitmodules --get "submodule.$path.url")
          echo "$path -> $sha ($url)"
          if ! git fetch --depth=1 -q "$url" "$sha"; then
            echo "::error::submodule の commit $sha が $url に存在しません。fork へ先に push してください (git -C $path push origin <branch>)"
            exit 1
          fi

          # **doc の pin が指す tag が、gitlink と同じ commit か。**
          # `make submodulepin-check` は SHA だけを突き合わせる — tag から SHA を
          # 解くにはネットワークが要り、`make gates` はそれを前提にできないため。
          # **tag 名の正しさを見られるのはここだけ** (#2969)。
          # #2963 の事故は「tag だけ直して gitlink を忘れた」形だったので、
          # SHA 側を書き換え忘れると gates は素通りする。ここで塞ぐ。
          n=$(grep -c '\*\*現在の pin は ' docs/divergence.md || true)
          if [ "$n" != "1" ]; then
            echo "::error::docs/divergence.md の pin 行が $n 件です。ちょうど 1 件にしてください (書式: **現在の pin は \`<tag>\` (\`<短縮 SHA>\`)。**)"
            exit 1
          fi
          # shellcheck disable=SC2016  # sed の後方参照なのでシェルに展開させない
          tag=$(sed -n 's/.*\*\*現在の pin は `\([^`]*\)`.*/\1/p' docs/divergence.md)
          # annotated tag なら `^{}` が commit を指す。fork の tag は lightweight だが
          # 将来変わっても壊れないよう両方見る。
          tagsha=$(git ls-remote "$url" "refs/tags/${tag}^{}" | cut -f1)
          [ -n "$tagsha" ] || tagsha=$(git ls-remote "$url" "refs/tags/${tag}" | cut -f1)
          if [ -z "$tagsha" ]; then
            echo "::error::docs/divergence.md の pin が指す tag $tag が $url にありません。tag を push し忘れていませんか"
            exit 1
          fi
          if [ "$tagsha" != "$sha" ]; then
            echo "::error::docs/divergence.md の tag $tag は $tagsha を指しますが、gitlink は $sha です。doc と pointer のどちらかが古いままです"
            exit 1
          fi
          echo "pin ok: $tag -> $tagsha"

          # **§4-2 の表の tag が fork に実在するか (#3144)。**
          # あの表は「還元不能な差分の一覧」の錨なので、typo した tag が残ると行が
          # 指す先を追えなくなる。`assertForkTagSequence` は表の中の連番しか見て
          # おらず、実在しない tag を書いても通る。
          # **submodule の checkout は shallow で tag が降りてこない**ので Go 側の
          # gate では見られない。`git ls-remote --tags` は ref の一覧だけを取るので
          # 1 往復で済む (実測 0.5 秒 / 121 tag)。
          git ls-remote --tags "$url" | sed 's/.*refs\/tags\///; s/\^{}$//' | sort -u > /tmp/fork-tags.txt
          # shellcheck disable=SC2016  # sed の後方参照なのでシェルに展開させない
          sed -n 's/^| `\([0-9][0-9.]*-mk\.[0-9][0-9]*[a-z]*\)` |.*/\1/p' docs/divergence.md | sort -u > /tmp/doc-tags.txt
          doccount=$(wc -l < /tmp/doc-tags.txt)

          # **件数は冒頭サマリの宣言値と一致すること。** 「1 件以上」のような下限だと
          # 全滅しか見られず、書式が少し変わって 115 行中 114 行が抽出から落ちても
          # 緑になる (#3142 のレビューで実測)。サマリの値は `TestDivergenceDoc_*` が
          # §4-2 の行数と一致することを別途強制しているので、ここと突き合わせれば
          # 「抽出できた数 == 表の行数 == 宣言値」が閉じる。
          declared=$(sed -n 's/^| fork frontend の独自変更 | \([0-9]*\) tag .*/\1/p' docs/divergence.md)
          if [ -z "$declared" ]; then
            echo "::error::docs/divergence.md 冒頭サマリの \`fork frontend の独自変更\` 行から件数を読めませんでした。書式を変えたならこの step も直してください"
            exit 1
          fi
          if [ "$doccount" != "$declared" ]; then
            echo "::error::docs/divergence.md §4-2 から $doccount 件しか tag を拾えませんでした (冒頭サマリの宣言は $declared 件)。表の書式を変えたならこの step も直してください"
            exit 1
          fi
          missing=$(comm -23 /tmp/doc-tags.txt /tmp/fork-tags.txt)
          if [ -n "$missing" ]; then
            echo "::error::docs/divergence.md §4-2 の tag が $url にありません: $(echo "$missing" | tr '\n' ' ')"
            exit 1
          fi
          echo "§4-2 tags ok: $doccount 件すべて fork に存在"

      # 同梱サンプルは **既定無効** (#2495)。clone しただけの運営者のバイナリ・
      # フロント・DB に勝手に入らないようにするため。有効なままだと、設定して
      # いなくても plugin_wiring.go が Routes / Jobs の登録より先に専用 schema を
      # 開いて migration を適用する (schema を作れない環境では起動が落ちる)。
      #
      # **一時的に外して戻し忘れるのを止めるための gate。** trustlevel は #2586 で
      # `disabled: true` 付きで同梱したあと、#2585 の実測を採るために e2ca1fde で
      # 意図的に外し、実測が終わって #2585 が close されても戻っていなかった
      # (#2701)。恒久的に有効にする方針にするならこの step を変える。手元で
      # 動かすだけなら `make plugin-dev PLUGIN=plugins/<name>` を使う
      # (`mk-plugin.yml` を触らずに済む。docs/plugins/development.md)。
      #
      # **判定は git ls-files + grep だけで完結させる。** `pluginbuild` に読ませる
      # ほうが parser 一致で厳密だが、`pluginbuild` は git ではなく**ディレクトリ**を
      # 走査する (main.go:277)。`plugins/*` は運営者が自前プラグインを置く場所
      # (gitignore 済み) なので、手元で同じ検査を回すと自前プラグインを拾って
      # 誤検知する。生成物を書く副作用もあり、`make plugin-dev` の配線を巻き戻す。
      #
      # **残る穴**: 行ベースの判定なので、**parser がキーとして読まない位置**に
      # 同じ行があると通る (2 つ目の YAML ドキュメント、flow collection の中など。
      # どちらも実測)。塞ぐには `pluginbuild` に副作用の無い check mode を足す
      # ことになるので、意図的に行わないと踏めない形として許容している。
      #
      # **逆に、正規表現を緩めないこと。** `disabled: True` / `yes` / 行末コメント
      # 付きは parser では disabled と読まれるがここでは落ちる。安全側に倒れて
      # いるだけなので実害は無い。「誤検知」と見て緩めると、parser とのズレが
      # 今度は**危険側**に開く。
      - name: Check bundled plugins are disabled by default
        run: |
          files=$(git ls-files 'plugins/*/mk-plugin.yml')
          # **空でも緑にしない。** `plugins/` の移動や marker 名の変更で列挙が
          # 空振りすると、検査していないのに通ってしまう (plugin-tests job の
          # 同型ステップと同じ guard)。
          if [ -z "$files" ]; then
            echo "同梱プラグインの mk-plugin.yml が 1 つも見つかりません (列挙が壊れています)"
            exit 1
          fi
          fail=0
          for f in $files; do
            if grep -qE '^disabled:[[:space:]]*true[[:space:]]*$' "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f — 'disabled: true' の行 (完全一致) がありません。disabled を含む行:"
              grep -n disabled "$f" || echo "  (無し)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Vet bundled plugins
        run: |
          # 列挙は git に任せる。ディレクトリを書き並べると、新しく同梱した
          # ものが黙って検査対象から漏れる。
          mods=$(git ls-files 'plugins/*/go.mod')
          if [ -z "$mods" ]; then
            echo "同梱プラグインが 1 つも見つかりません (列挙が壊れています)"
            exit 1
          fi
          for mod in $mods; do
            dir=$(dirname "$mod")
            echo "==> $dir"
            (cd "$dir" && GOWORK=off go vet ./...)
          done

  # 各shardは並列に走るが、checkは `test-shards (N)` という名前で個別に登録される。
  # ブランチ保護が `test` という名前のcheckを要求するため、後段の `test` job が
  # 全shardを束ねて単一の `test` checkを公開する (needs: test-shards)。
  test-shards:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mk
          POSTGRES_PASSWORD: mk
          POSTGRES_DB: misskey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: misskey_test
      TEST_DB_USER: mk
      TEST_DB_PASS: mk
      TEST_DB_SSLMODE: disable
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: 6379
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 4

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # 全テストパッケージをImportPathでソートしmodulo分割する。
      # go listの出力順は決定的なので各shardは毎runで同じパッケージ集合を担当する。
      # `awk 'NF'`でtest無しパッケージのempty行を防御的に除外する。現状Go 1.25/1.26
      # は空テンプレート結果を出力しないが、将来のtoolchain変更でNRがずれて
      # shard分配が不均衡になるリスクを潰す。
      - name: Determine shard packages
        id: shard
        run: |
          ALL=$(go list -f '{{if (or .TestGoFiles .XTestGoFiles)}}{{.ImportPath}}{{end}}' ./... | awk 'NF' | sort)
          PKGS=$(echo "$ALL" | awk -v s="$SHARD_INDEX" -v n="$SHARD_TOTAL" 'NR % n == (s % n)' | tr '\n' ' ')
          echo "Shard $SHARD_INDEX/$SHARD_TOTAL packages:"
          echo "$PKGS" | tr ' ' '\n' | sed '/^$/d'
          echo "pkgs=$PKGS" >> "$GITHUB_OUTPUT"

      # pipefailを明示的に立てないと`go test ... | tee`が失敗を握りつぶす
      # (teeのexit 0がパイプライン全体の結果になる) ため設定する。
      #
      # -shuffle は固定seedで回す (#2795)。テストの実行順に依存する実装
      # (プロセス共有の状態を張り替えて戻さない等) をここで落とす。
      #
      # `on` (毎回ランダム) にしない: 失敗を手元で再現できず、required checkの
      # `test`が不定期に赤くなる。
      #
      # **shard番号をseedにしない**: shard配属は`NR % 4`なので、テスト
      # パッケージが1つ増えるだけで既存パッケージのseedが変わり、順序が丸ごと
      # 入れ替わる。**無関係なPRが未実行の順序を引いて赤くなる**ため、
      # ランダムseedと同じ問題を別経路で持ち込む。
      #
      # 全shard共通の固定値なら順序はshard配属に依存しない。1パッケージが
      # 試す順序は1通りなので、`-shuffle`だけで全ての順序依存が見つかるわけでは
      # ない。
      #
      # **seedは実測で選ぶこと。** 覚えやすい値 (issue番号など) を置くと、
      # 検出力を持たない値を引く。#2795で実測したところ、restoreを無効化した
      # 変異が落ちるseedは12個中7個だけだった (2795自身は落ちない側)。
      # 3は最も強く6テストが落ちる。変えるときは
      # `internal/server/global_state_test.go`のrestoreProcessGlobalsの
      # cleanup本体を`if true { return }`で潰し、その状態で落ちることを
      # 確認してから差し替える。
      - name: Run tests with coverage
        run: |
          set -o pipefail
          go test ${{ steps.shard.outputs.pkgs }} \
            -race \
            -count=1 \
            -shuffle=3 \
            -timeout 10m \
            "-coverprofile=coverage-shard-${SHARD_INDEX}.out" \
            -covermode=atomic 2>&1 | tee test_output.txt

      - name: Enforce per-package coverage
        run: |
          # admin: handler_stubs.goにSMTP/queue/DB集計等の外部依存が多く90%未到達。
          #        現状83.8%で+3.8%のマージン確保のため80%にロック (将来90%に戻す)
          # e2e: 実挙動カバレッジで測る意味が薄いため0%
          # testutil: mock/test helper専用パッケージ。production codeではなく
          #           他テストから呼ばれるだけなのでe2eと同様に0%扱い。
          # server: 大部分が router.go の wire 層 (handler 設定 / middleware
          #         配線) で、e2e / drop-in test 経由で実挙動検証する設計。
          #         個別 handler ファイル (avatar.go / identicon.go 等) は
          #         _test.go 単体でカバーするが、ファイル単位で見ると 90%
          #         相当でも、router.go のウェイトで package 全体が
          #         数% に張り付くので 0% 扱いとする (#462)。
          # 他の全パッケージは90%を維持
          grep '^ok' test_output.txt | awk '{
            pkg = $2
            match($0, /[0-9.]+%/)
            cov = substr($0, RSTART, RLENGTH-1) + 0
            threshold = (pkg ~ /\/admin$/) ? 80 : (pkg ~ /\/e2e/ || pkg ~ /\/testutil$/ || pkg ~ /\/server$/) ? 0 : 90
            if (cov < threshold) {
              printf "FAIL: %s coverage %.1f%% is below %d%%\n", pkg, cov, threshold
              fail = 1
            }
          } END { if (fail) exit 1 }'
          echo "Shard $SHARD_INDEX: all packages meet coverage thresholds"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}.out
          if-no-files-found: ignore

  # ブランチ保護が要求する `test` check を満たすためのaggregator。全shardの結果を
  # `needs.test-shards.result` で集約し、いずれかが失敗したらこのjob自体を失敗
  # させる。`if: always()` を付けないとshard失敗時にskipされ "test" check が
  # 完了状態にならない。
  test:
    runs-on: ubuntu-latest
    needs: test-shards
    if: always()
    steps:
      - name: Verify all shards passed
        run: |
          if [ "${{ needs.test-shards.result }}" != "success" ]; then
            echo "test-shards result: ${{ needs.test-shards.result }}"
            exit 1
          fi
          echo "All test shards passed"

  # 同梱プラグインのテストを実行する (#2588)。
  #
  # プラグインは**別 module** なので `go list ./...` に含まれず、test-shards の
  # 対象にならない。実行時間が短い (1 秒未満) ので shard の分配ロジックに手を
  # 入れるより独立させる方が単純。
  #
  # **MK_PLUGIN_TESTS_REQUIRE_DB を渡すのが要点。** テストは手元で PostgreSQL を
  # 用意していない開発者のために接続不能を skip するが、skip は成功として扱われる
  # ので、CI でそのままだと接続に失敗しても緑になる = 無検証で通る。この変数が
  # あるとテスト側が skip せず落ちる。
  plugin-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mk
          POSTGRES_PASSWORD: mk
          POSTGRES_DB: misskey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: misskey_test
      TEST_DB_USER: mk
      TEST_DB_PASS: mk
      MK_PLUGIN_TESTS_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # tracked な同梱プラグインを列挙する。新しく同梱したものが自動で入る。
      # **`plugins/*` は .gitignore 済みで、同梱するものだけ例外指定している**
      # ので、git の tracked 一覧がそのまま「同梱プラグイン」になる。
      - name: Test bundled plugins
        run: |
          set -o pipefail
          mods=$(git ls-files 'plugins/*/go.mod')
          if [ -z "$mods" ]; then
            echo "同梱プラグインが 1 つも見つかりません (列挙が壊れています)"
            exit 1
          fi
          for mod in $mods; do
            dir=$(dirname "$mod")
            echo "==> $dir"
            (cd "$dir" && GOWORK=off go test ./... -count=1)
          done

      # docs/plugins/authoring.md のスニペットが実際にコンパイルできるか。
      # #2639 では「コンパイルできない例を直す」作業が 6 周にわたって別の
      # コンパイルエラーを作り続けたので、人の目に頼らず回す。この job は既に
      # 別 module のテストを GOWORK=off で回しているので構成は変わらない。
      # 本体テストの後ろに置くのは、doc が 1 つ壊れただけでプラグインの
      # テストが走らなくなるのを避けるため。
      - name: Check authoring.md snippets compile
        run: make plugin-doc-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # **`make` 経由で呼ぶ。** actionlint の版は Makefile 側に 1 つだけ置く。
      # ここに書き写すと #2841 (make test と CI の flag がずれていた) と同じ
      # ドリフトが起きる。
      - name: Actionlint
        run: make actionlint

      # **gofmt の終了コードも見る。** Go 1.27 から `gofmt -d` は差分があると
      # exit 1 を返すので、`diff=$(...)` を素で書くと `bash -e` がそこで step を
      # 止め、**差分を 1 行も出さずに落ちる** (実測)。`if` の条件に置けば `-e` は
      # 効かない。構文エラー (stderr) も一緒に出す。
      - name: Format check
        run: |
          if ! diff=$(gofmt -s -d . 2>&1) || [ -n "$diff" ]; then
            echo "$diff"
            exit 1
          fi

      # 重複 fixture ID lint (#1094 / #1089 follow-up)。
      # internal/repository テストで insertTestUser / insertRemoteTestUser
      # が同じ ID リテラルを 2 つ以上の caller で使うと、 cleanup 失敗時に
      # 行残留 → 次 test の PK 衝突を起こす (#1089 で 17 箇所観測)。caller
      # ごとに unique な ID を強制するための regression guard。
      #
      # 将来 caller-aware な runtime seed (insertTestUser 内部で
      # runtime.Caller から prefix 生成) を入れれば本 lint は不要になる
      # が、user.id が CHARACTER(16) で既存 ID 最長 12 char のため
      # prefix 余裕が 4 char しか無く、schema 変更を伴う大改修となるため
      # 現状は本 lint で網を張る運用とする (#1094 の中期対応として継続検討)。
      - name: Check duplicate test fixture IDs
        run: |
          set -e
          dupes=$(grep -rh 'insertTestUser(t, "\|insertRemoteTestUser(t, "\|createTestUser(t, "' \
            internal/repository/*_test.go \
            | awk -F'"' '{print $2}' | sort | uniq -c | sort -rn \
            | awk '$1 > 1')
          if [ -n "$dupes" ]; then
            echo "Duplicate test fixture IDs detected (#1094 / #1089):"
            echo ""
            # 各重複 ID について file:line を併記して reviewer が CI ログだけで
            # 犯人を特定できるようにする (= 手動 grep 不要)。
            while IFS= read -r line; do
              count=$(echo "$line" | awk '{print $1}')
              id=$(echo "$line" | awk '{print $2}')
              echo "  $id (used $count times):"
              grep -n "\"$id\"" internal/repository/*_test.go | sed 's/^/    /'
              echo ""
            done <<< "$dupes"
            echo "Each insertTestUser / insertRemoteTestUser / createTestUser caller must use"
            echo "a unique ID literal across the repository package. Rename"
            echo "the duplicates to file-specific prefixes (e.g. u_<file>_*)."
            exit 1
          fi
          echo "No duplicate test fixture IDs."

      # **`make` 経由で呼ぶ。** 版の定義は Makefile 側に 1 つだけ置く
      # (#2841 と同じドリフトを避ける)。
      #
      # **一番重いので最後に置く。** 他は grep / gofmt / actionlint で数秒だが
      # これは分単位なので、速い検査で落ちるものは先に落とす。
      - name: Golangci-lint
        run: make golangci-lint

  # fork frontend (third_party/misskey) の型チェック。
  #
  # 1.0 以降 fork frontend は mk-go 独自に進化させる方針なので、型崩れを
  # 検出する手段が要る。`make uds-frontend-build` / `e2e-frontend-build` は
  # 本番が bind-mount している third_party/misskey/built を書き換えるため
  # 検証には使えない。vue-tsc --noEmit なら出力物を作らず型だけ見られる。
  #
  # required check には入れない (build / test / lint の 3 つが required)。
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm のバージョンは submodule 側 package.json の packageManager から
          # 取る。mk リポジトリ直下には package.json が無い。
          package_json_file: third_party/misskey/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: third_party/misskey/.node-version
          cache: pnpm
          cache-dependency-path: third_party/misskey/pnpm-lock.yaml

      - name: Install misskey workspace dependencies
        working-directory: third_party/misskey
        run: pnpm install --frozen-lockfile

      # frontend の型解決には workspace package の生成物が要る。i18n (locales の
      # 型定義) と misskey-bubble-game を落とすと `Cannot find module 'i18n'` 系で
      # 44 件こける。どれが要るかを絞り込むより `-r build` で全部作る方が、上流が
      # 依存を増やしたときに壊れない。
      #
      # frontend 自身のビルド (build-assets) は型チェックに不要なので呼ばない。
      - name: Build workspace packages
        working-directory: third_party/misskey
        run: pnpm build-pre && pnpm -r build

      # 同梱サンプルの frontend を取り込んでから型を見る。これが無いと
      # plugin-api.ts を壊してもサンプル側では検出されない。サンプルは
      # mk-plugin.yml で既定無効 (#2495) なので、disabled も含める
      # plugins-all を使う。
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate plugin artifacts
        run: make plugins-all

      # 生成した glue (plugins_generated.go) を含む統合バイナリのコンパイルも
      # 見る。build job の `Vet bundled plugins` は各プラグインを単体で vet する
      # だけなので、Register の配線や workspace の依存解決の崩れは検出できない。サンプルが既定無効に
      # なったことで `make build` を経由する他の workflow からもこの経路が
      # 消えたため、ここで担保する (#2495)。生成された go.work を使うので
      # GOWORK は無効化しない。
      - name: Build integrated binary with sample plugin
        run: go build -o /dev/null ./cmd/misskey

      - name: Type check (vue-tsc)
        run: make frontend-check

      # fork frontend の eslint (#2843)。**型だけでは足りない。** 1.0 以降
      # fork frontend は mk-go 独自に進化させる方針で、独自コードは増え続ける
      # (docs/divergence.md §4-2)。型は vue-tsc が見るが、それ以外の規約違反は
      # 誰も見ていなかった。実際 mk-go 独自ファイル 2 つに commit 済みの
      # 違反が 4 箇所残っていた (2026.7.0-mk.22j で修正)。
      #
      # upstream AGENTS.md も「変更を出す前の最低チェック」に pnpm lint
      # (typecheck + eslint) を挙げている。範囲はその `pnpm eslint` と同じ
      # `src/**/*.{ts,vue}` にする — **`eslint .` にしないこと**。upstream が
      # lint していない test/ まで拾い、追従のたびに他人の負債で落ちる
      # (実測で test/ 込みだと 115 件)。
      #
      # 依存インストールと workspace ビルドは上の step で済んでいるので、
      # 追加コストは eslint の実行時間だけ。
      - name: Lint (eslint)
        working-directory: third_party/misskey/packages/frontend
        run: pnpm eslint

      # fork frontend の vitest (#2844)。**どの workflow でも実行されていなかった。**
      # spec は 20 本あるが ci.yml にも他の workflow にも実行箇所が無く、
      # dropin-frontend-e2e は cypress で別物。
      #
      # #2831 で実際に効いた: frontend の修正 (WebSocket 再接続時の未読件数の
      # 再同期) は in-flight 重複排除 / スロットル / 世代カウンタの 3 つのガードが
      # 相互作用する実装なのに、敵対的レビューの「テストがゼロ」という指摘に対して
      # **テスト基盤が無いこと**を理由に見送っている。
      #
      # 依存インストールと workspace ビルドは上の step で済んでいるので、追加
      # コストは vitest の実行時間だけ。手元の再現は `make frontend-test`。
      - name: Unit test (vitest)
        working-directory: third_party/misskey/packages/frontend
        run: pnpm test

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Dockerfile の builder は go.mod の `go` directive と同じ patch version を
      # 指していないといけない。govulncheck が見るのは go.mod 側なので、ここが
      # ずれていると **CI は緑のまま、実際に配る image だけが脆弱**になる。
      # floating tag (`golang:1.27-alpine`) に戻すと再現性も失われる。
      #
      # **`Dockerfile` だけを見ない。** golang image を使う tracked な Dockerfile を
      # 全て対象にする。`Dockerfile.bundled` は配る bundled image と
      # build-with-plugins の builder なのに floating tag のまま検査から漏れていた。
      # 列挙は `git grep` なので、golang image を使う Dockerfile が増えても自動で
      # 対象になる。1 つも拾えなければ落とす (書式が変わって空振りすると、検査
      # していないのに緑になる)。
      - name: Go version pin is consistent between go.mod and Dockerfiles
        run: |
          set -euo pipefail
          gomod=$(awk '/^go [0-9]/ {print $2; exit}' go.mod)
          echo "go.mod=$gomod"
          lines=$(git grep -niE '^[[:space:]]*FROM[[:space:]]+(--[^[:space:]]+[[:space:]]+)*(docker\.io/)?(library/)?golang[:@[:space:]]' \
            -- ':(icase)*dockerfile*' ':(icase)*containerfile*' || true)
          if [ -z "$lines" ]; then
            echo "golang image を使う Dockerfile を 1 つも見つけられなかった" >&2
            exit 1
          fi
          # 行は `<path>:<lineno>:FROM [--flag ...] <image> [AS <name>]`。
          # image は FROM の後ろで最初の `--` で始まらない語。
          printf '%s\n' "$lines" | awk -v want="golang:${gomod}-alpine" '
            {
              split($0, p, ":")
              loc = p[1] ":" p[2]
              body = substr($0, length(loc) + 2)
              n = split(body, w, /[[:space:]]+/)
              image = ""
              for (i = 1; i <= n; i++) {
                if (w[i] == "" || tolower(w[i]) == "from" || w[i] ~ /^--/) continue
                image = w[i]; break
              }
              print loc " " image
              # 配る Dockerfile は `golang:<ver>-alpine@sha256:<digest>` で tag と
              # digest を併記している。照合するのは tag 側で、digest は形だけ見る
              # (tag と digest の対応は registry に問い合わせないと分からない)。
              tag = image
              dig = ""
              at = index(image, "@")
              if (at > 0) {
                tag = substr(image, 1, at - 1)
                dig = substr(image, at + 1)
              }
              if (dig != "" && !(dig ~ /^sha256:[0-9a-f]+$/ && length(dig) == 71)) {
                printf "::error::%s の builder (%s) の digest が sha256:<64 桁> の形でない\n", loc, image > "/dev/stderr"
                bad = 1
              }
              if (tag != want) {
                printf "::error::%s の builder (%s) が go.mod と同じ patch version (%s) を指していない\n", loc, image, want > "/dev/stderr"
                bad = 1
              }
            }
            END { exit bad }'

      # 実際にデプロイするのは Linux なので GOOS=linux で解析する。既定のまま
      # だと host 依存の package load エラーで解析が空振りしうる。
      #
      # 検出は「呼び出しが到達可能なもの」に限られる (import しているだけの
      # 脆弱性は落とさない)。到達可能なものだけを落とすので、無視リストを
      # 育てずに運用できる。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GOOS=linux "$(go env GOPATH)/bin/govulncheck" ./...
