name: Diff e2e

# mk-go と Misskey TS に同一リクエストを投げて、レスポンスを **値レベル** で
# diff する (#2078 / #2368)。他のゲートとは守備範囲が違う。
#
#   本家 backend e2e … 本家のテストが通るか
#   shape drift      … フィールドの有無・型
#   diff-e2e         … 同じ入力に対する値そのもの
#
# shape が合っていても値が違う類のバグはこれでしか捕まらない。実際
# #2091 / #2094 / #2097 / #2101 を検出している。
#
# 意図的な差分は `tests/diff/test_endpoints.py` の ignore-list に**理由付きで**
# 登録する。ここを空振りさせると本物の乖離が埋もれるので、追加するときは
# docs/divergence.md にも対応する記述があるかを確認すること。
#
# - pull_request: paths に該当する変更のみ。**required checks には入れない**
# - workflow_dispatch: 任意の ref で手動実行できる
#
# 非ブロッキングを `continue-on-error: true` で実現しないこと。あれは job を
# 成功扱いにするので失敗が完全に不可視になる。

on:
  pull_request:
    branches: [develop, main]
    # レスポンスの値に影響しうる変更だけを対象にする。
    paths:
      - "internal/**"
      - "cmd/**"
      - "migration/**"
      # API の通過の集計 (#4037)。internal/routecoverage は internal/** に入る
      - "tools/routecoverage/**"
      - "tests/diff/**"
      - "frontend/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/diff-e2e.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to test"
        required: false
        default: "develop"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Dockerfile.mkgo が frontend/built を COPY するので、
      # docker build より前に host で pnpm build しておく。dropin-e2e.yml と
      # 同じ戦略で actions/cache に pin する。
      # **cache key は frontend/ の木の SHA で取る。** `pnpm-lock.yaml` の
      # hash だと、frontend/ のソースを変えても lock が動かない限り cache hit に
      # なり、**古い `built/` が使われる** (#2786 で実際に踏んだ。fork の
      # `boot.js` を直したのに CI では反映されず spec が落ちた)。
      - name: Resolve frontend tree SHA
        id: misskey-sha
        run: echo "sha=$(git rev-parse HEAD:frontend)" >> "$GITHUB_OUTPUT"

      - name: Cache misskey workspace (built + node_modules)
        id: cache-misskey
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            frontend/node_modules
            frontend/packages/*/node_modules
            frontend/built
          key: misskey-workspace-${{ runner.os }}-${{ steps.misskey-sha.outputs.sha }}

      - name: Set up pnpm
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # pnpm のバージョンは frontend/package.json の packageManager から
          # 取る。mk リポジトリ直下には package.json が無い。
          #
          # **corepack を使わない (#2914)。** Node.js 26 の配布物に corepack は
          # 含まれておらず、今動いているのは runner image にプリインストールされた
          # Node の corepack が PATH に残るからでしかない。image の Node が 26 に
          # なった時点で一斉に落ちる。
          #
          # **版は元から揃っていた。** corepack は packageManager の pin を尊重する
          # ので、`prepare pnpm@latest` を挟んでも workspace 内で走るのは 11.25.0
          # (実測)。ここで消えるのは corepack への依存と、使われない 12.x を毎回
          # ダウンロードしていた無駄。
          package_json_file: frontend/package.json

      - name: Set up Node.js
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version

      # pluginbuild の生成物 (server-plugins.generated.ts) は追跡していない (#3379)
      # ので、frontend をビルドする前に書き出す。
      - name: Set up Go (pluginbuild)
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build frontend bundle
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        working-directory: frontend
        run: |
          (cd .. && GOWORK=off go run ./tools/pluginbuild)
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pre-pull Misskey TS image
        run: docker pull misskey/misskey:2026.10.1

      # down → up → healthy 待ち → pytest を通しで実行する。
      - name: Run make diff-check
        run: make diff-check

      # Elythia のアクセスログを、成功したときも残す (#4037)。集計は api-coverage
      # job が行う (この job の Go は cache が外れたときしか入らない)。
      - name: Save Elythia access log
        if: ${{ !cancelled() }}
        run: docker compose -f tests/diff/compose.yml logs --no-log-prefix --no-color mkgo > /tmp/mkgo-access-diff-e2e.log || true

      - name: Upload Elythia access log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mkgo-access-diff-e2e
          path: /tmp/mkgo-access-diff-e2e.log
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true

      - name: Capture docker compose logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/diff-logs
          docker compose -f tests/diff/compose.yml logs > /tmp/diff-logs/compose.log 2>&1 || true
          docker compose -f tests/diff/compose.yml ps   > /tmp/diff-logs/ps.log 2>&1 || true

      - name: Upload logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diff-logs
          path: /tmp/diff-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Final teardown
        if: always()
        run: docker compose -f tests/diff/compose.yml down -v >/dev/null 2>&1 || true

  # 各 job が残した集計を足し合わせ、この層で叩かれた API を Summary に出す (#4037)。
  # diff job が残した Elythia のアクセスログ (mkgo-access-diff-e2e) を読む。
  # 落ちた job があっても集計は出す (cancelled のときだけ止める)。notes/create を
  # 2xx で通っていなければ落とす (ログの書式が変わって何も拾えなくなるのを防ぐ下限)。
  api-coverage:
    name: API coverage
    needs: diff
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # イベントの時点の commit に固定する。pull_request の github.ref は merge ref で、
          # job の開始のたびに解決し直すので、run の途中で base が進むと別の commit を指す
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mkgo-access-diff-e2e
          path: route-inputs
          # artifact が 1 つだけのときは、名前のディレクトリを作らずに直下へ展開する
          # (download-artifact の仕様)。数によって置き場所が変わらないよう、常に
          # 直下へまとめる。そのため、ファイル名は artifact ごとに変えておく
          merge-multiple: true

      - name: Summarize API hits
        run: make route-coverage ROUTE_LAYER=diff-e2e ROUTE_OUT=route-hits-diff-e2e.json ROUTE_INPUTS='route-inputs/*.log' >> "$GITHUB_STEP_SUMMARY"

      # 全層を合わせるときの材料 (make route-coverage ROUTE_INPUTS='*.json'、docs/ci.md)
      - name: Upload API hits
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: route-hits-diff-e2e
          path: route-hits-diff-e2e.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
