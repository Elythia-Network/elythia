name: Diff e2e

# mk-go と Misskey TS に同一リクエストを投げて、レスポンスを **値レベル** で
# diff する (#2078 / #2368)。他のゲートとは守備範囲が違う。
#
#   本家 backend e2e … 本家のテストが通るか
#   shape drift      … フィールドの有無・型
#   diff-e2e         … 同じ入力に対する値そのもの
#
# shape が合っていても値が違う類のバグはこれでしか捕まらない。実際
# #2091 / #2094 / #2097 / #2101 を検出している。
#
# 意図的な差分は `tests/diff/test_endpoints.py` の ignore-list に**理由付きで**
# 登録する。ここを空振りさせると本物の乖離が埋もれるので、追加するときは
# docs/divergence.md にも対応する記述があるかを確認すること。
#
# - pull_request: paths に該当する変更のみ。**required checks には入れない**
# - workflow_dispatch: 任意の ref で手動実行できる
#
# 非ブロッキングを `continue-on-error: true` で実現しないこと。あれは job を
# 成功扱いにするので失敗が完全に不可視になる。

on:
  pull_request:
    branches: [develop, main]
    # レスポンスの値に影響しうる変更だけを対象にする。
    paths:
      - "internal/**"
      - "cmd/**"
      - "migration/**"
      - "tests/diff/**"
      - "third_party/misskey"
      - "docker-compose.diff.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/diff-e2e.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to test"
        required: false
        default: "develop"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # mkgo image が third_party/misskey のアセットを COPY する。
          submodules: recursive

      # Dockerfile.mkgo が third_party/misskey/built を COPY するので、
      # docker build より前に host で pnpm build しておく。dropin-e2e.yml と
      # 同じ戦略で actions/cache に pin する。
      # **cache key は submodule の commit SHA で取る。** `pnpm-lock.yaml` の
      # hash だと、submodule のソースを変えても lock が動かない限り cache hit に
      # なり、**古い `built/` が使われる** (#2786 で実際に踏んだ。fork の
      # `boot.js` を直したのに CI では反映されず spec が落ちた)。
      - name: Resolve misskey submodule SHA
        id: misskey-sha
        run: echo "sha=$(git rev-parse HEAD:third_party/misskey)" >> "$GITHUB_OUTPUT"

      - name: Cache misskey workspace (built + node_modules)
        id: cache-misskey
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/misskey/node_modules
            third_party/misskey/packages/*/node_modules
            third_party/misskey/built
          key: misskey-workspace-${{ runner.os }}-${{ steps.misskey-sha.outputs.sha }}

      - name: Set up pnpm
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm のバージョンは submodule 側 package.json の packageManager から
          # 取る。mk リポジトリ直下には package.json が無い。
          #
          # **corepack を使わない (#2914)。** Node.js 26 の配布物に corepack は
          # 含まれておらず、今動いているのは runner image にプリインストールされた
          # Node の corepack が PATH に残るからでしかない。image の Node が 26 に
          # なった時点で一斉に落ちる。
          #
          # **版は元から揃っていた。** corepack は packageManager の pin を尊重する
          # ので、`prepare pnpm@latest` を挟んでも workspace 内で走るのは 11.25.0
          # (実測)。ここで消えるのは corepack への依存と、使われない 12.x を毎回
          # ダウンロードしていた無駄。
          package_json_file: third_party/misskey/package.json

      - name: Set up Node.js
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: third_party/misskey/.node-version

      - name: Build third_party/misskey frontend bundle
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        working-directory: third_party/misskey
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pre-pull Misskey TS image
        run: docker pull misskey/misskey:2026.9.1

      # down → up → healthy 待ち → pytest を通しで実行する。
      - name: Run make diff-check
        run: make diff-check

      - name: Capture docker compose logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/diff-logs
          docker compose -f docker-compose.diff.yml logs > /tmp/diff-logs/compose.log 2>&1 || true
          docker compose -f docker-compose.diff.yml ps   > /tmp/diff-logs/ps.log 2>&1 || true

      - name: Upload logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-logs
          path: /tmp/diff-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Final teardown
        if: always()
        run: docker compose -f docker-compose.diff.yml down -v >/dev/null 2>&1 || true
