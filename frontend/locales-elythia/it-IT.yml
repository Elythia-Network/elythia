introMisskey: "Eccoci! Elythia è un servizio di microblogging decentralizzato, libero e aperto. \n📡 Puoi pubblicare «Note» per condividere ciò che sta succedendo o per dire a tutti qualcosa su di te. \n👍 Puoi reagire inviando emoji rapidi alle «Note» provenienti da altri profili nel Fediverso.\n🚀 Esplora un nuovo mondo insieme a noi!"
poweredByMisskeyDescription: "{name} è uno dei servizi (chiamati istanze) che utilizzano la piattaforma open source <b>Elythia</b>."
initialPasswordForSetupDescription: "Se hai installato Elythia personalmente, usa la password che hai inserito nel file di configurazione.\nSe stai utilizzando un servizio di hosting Elythia, usa la password fornita dal gestore.\nSe non hai una password preimpostata, lascia il campo vuoto e continua."
flagAsBotDescription: "Attiva questo campo se il profilo esegue principalmente operazioni automatiche. L'attivazione segnala agli altri sviluppatori come comportarsi per evitare catene d’interazione infinite con altri bot. I sistemi interni di Elythia si adegueranno al fine di trattare questo profilo come bot."
useSoundOnlyWhenActive: "Emetti suoni solo quando Elythia è in attività"
scratchpadDescription: "Lo Scratchpad offre un ambiente per esperimenti di AiScript. È possibile scrivere, eseguire e confermare i risultati dell'interazione del codice con Elythia."
sendErrorReportsDescription: "Quando abilitato, se si verifica un problema, informazioni dettagliate sugli errori verranno condivise con Elythia in modo da aiutare a migliorare la qualità del software.\nCiò include informazioni come la versione del sistema operativo, il tipo di navigatore web che usi, la cronologia delle attività, ecc."
logoutConfirm: "Vuoi davvero uscire da Elythia? "
goToMisskey: "Vai a Elythia"
repositoryUrlDescription: "Se esiste un repository il cui il codice sorgente è disponibile pubblicamente, inserisci il suo URL. Se stai utilizzando Elythia così com'è (senza alcuna modifica al codice sorgente), inserisci https://github.com/Elythia-Network/elythia."
