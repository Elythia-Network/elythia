introMisskey: "Welcome! Elythia is an open source, decentralized microblogging service.\nCreate \"notes\" to share your thoughts with everyone around you. 📡\nWith \"reactions\", you can also quickly express your feelings about everyone's notes. 👍\nLet's explore a new world! 🚀"
poweredByMisskeyDescription: "{name} is one of the services powered by the open source platform <b>Elythia</b> (referred to as an \"Elythia instance\")."
initialPasswordForSetupDescription: "Use the password you entered in the configuration file if you installed Elythia yourself.\n If you are using an Elythia hosting service, use the password provided.\n If you have not set a password, leave it blank to continue."
flagAsBotDescription: "Enable this option if this account is controlled by a program. If enabled, it will act as a flag for other developers to prevent endless interaction chains with other bots and adjust Elythia's internal systems to treat this account as a bot."
aboutMkGo: "About Elythia"
usernameTooShort: "Must be at least {n} characters"
useSoundOnlyWhenActive: "Output sounds only if Elythia is active"
scratchpadDescription: "The Scratchpad provides an environment for AiScript experiments. You can write, execute, and check the results of it interacting with Elythia in it."
ephemeralRelayNotes: "Temporary storage for relayed notes"
enableEphemeralRelayNotes: "Store notes from relays temporarily"
enableEphemeralRelayNotesDescription: "Notes that only arrive through a relay are kept in the cache instead of the database. A note nobody interacts with disappears when it expires, so the database does not grow. Once someone reacts, replies or otherwise interacts with it, it is saved as a normal note."
ephemeralRelayNoteTtl: "Retention period"
ephemeralRelayNoteTtlDescription: "How long notes stay in the cache. A note older than this disappears unless someone has interacted with it."
ephemeralRelayNotesWarning: "When enabled, the global timeline cannot be scrolled back further than this retention period."
relayOrphanUserCleanup: "Cleaning up users from relays"
enableRelayOrphanUserCleanup: "Delete users nobody is connected to"
enableRelayOrphanUserCleanupDescription: "Every day, deletes users who were only seen through a relay and have no remaining notes, reactions or follow relationships. They are fetched again automatically when seen again, so nothing changes in what is shown."
relayOrphanUserGraceDays: "Grace period"
relayOrphanUserGraceDaysDescription: "Users last seen this many days ago or earlier are deleted. Too short a period keeps deleting and refetching active users, so it cannot be set below 7 days."
relayOrphanUserCleanupInfo: "Users known before the relay subscription and users whose profile has been opened are not deleted. Users you follow, block or mute are not deleted either."
needToRestartServerToApply: "An Elythia restart is required to reflect the change."
sendErrorReportsDescription: "When turned on, detailed error information will be shared with Elythia when a problem occurs, helping to improve the quality of Elythia.\nThis will include information such the version of your OS, what browser you're using, your activity in Elythia, etc."
mkGoUpdated: "Elythia has been updated!"
rateLimitCooldown: "Please wait a moment before retrying."
secretReentryRequired: "Enter the secret again"
secretReentryRequiredDescription: "When you change where it is sent (a host, a URL, etc.), enter the password or key that goes with it again. The saved value is not used for a new destination."
minimumUsernameLength: "Minimum username length"
minimumUsernameLengthDescription: "The minimum number of characters for a username when creating an account, from 1 to 20. Accounts created by an administrator are not limited by this, and existing accounts are not affected."
goToMisskey: "To Elythia"
repositoryUrlDescription: "If you are using Elythia as is (without any changes to the source code), enter https://github.com/Elythia-Network/elythia"
nightMeteorEffect: "Night Sky Meteors"
nightMeteorEffectDescription: "At night (8 PM to 4 AM) while a dark theme is in use, meteors occasionally streak across the screen. They do not appear while the seasonal screen effect is showing."
reactableRemoteReaction: "Allow piggybacking on reactions"
failedToLoadMedia: "Failed to load the file, or this browser cannot display or play its format"
nFilesSelected: "{n} selected"
unselectAll: "Clear selection"
