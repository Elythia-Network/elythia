  emojiApplicationMaxPending_caption: "How many requests may await review at the same time. Unlike the rolling limits, a slot is freed when a request is approved, rejected or withdrawn. This caps how long the moderation list gets, which the rolling limits do not. 0 means no limit here, but a user in several roles gets the largest value, so setting 0 on one role does not lift a limit set on the base role (raise that role's priority to do that)."
