  canUseEmojiAsAvatarDecoration_caption: "Lets members of this role wear this server's custom emoji as an avatar decoration. Sensitive emoji cannot be picked. The number that can be worn is shared with \"Max avatar decorations\" — emoji and the decorations registered by the administrator are counted together."
