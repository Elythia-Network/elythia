  canSearchIpHistory: "Can find related accounts by IP address"
  canSearchIpHistory_caption: "Allows looking up which accounts used which IP addresses. It enables both the screen that lists the local accounts that connected from an IP address you enter, and the screen that lists the other local accounts that used the same IP addresses as a given user. By default only administrators can use them. Using the same IP address does not mean being the same person (addresses are shared at home, at work, at school, on public Wi-Fi, on mobile networks and on VPNs). Use it as a clue for investigation."
