introMisskey: "Ласкаво просимо! Elythia - децентралізована служба мікроблогів з відкритим кодом.\nСтворюйте \"нотатки\", щоб поділитися тим, що відбувається, і розповісти всім про себе 📡\nЗа допомогою \"реакцій\" ви також можете швидко висловити свої почуття щодо нотаток інших 👍\nДосліджуймо новий світ! 🚀"
poweredByMisskeyDescription: "{name} є одним із сервісів (які називаються інстансами Elythia), що використовують платформу з відкритим вихідним кодом <b>Elythia</b>."
initialPasswordForSetupDescription: "Використайте пароль, вказаний у конфігураційному файлі, якщо ви встановлювали Elythia власноруч.\nЯкщо використовуєте сервіси хостингу Elythia, використайте наданий пароль.\nЯкщо ви не маєте паролю, лишіть порожнім щоб продовжити. "
flagAsBotDescription: "Ввімкніть якщо цей обліковий запис використовується ботом. Ця опція позначить обліковий запис як бота. Це потрібно щоб виключити безкінечну інтеракцію між ботами а також відповідного підлаштування Elythia."
useSoundOnlyWhenActive: "Відтворювати звуки лише коли Elythia активний"
scratchpadDescription: "Scratchpad надає середовище для експериментів з AiScript. Ви можете писати, виконувати його і тестувати взаємодію з Elythia."
needToRestartServerToApply: "Щоб застосувати зміну, потрібно перезапустити Elythia."
sendErrorReportsDescription: "При увімкненні детальна інформація про помилки буде надана Elythia у разі виникнення проблем, що дасть можливість покращити Elythia."
goToMisskey: "До Elythia"
repositoryUrlDescription: "Якщо ви використовуєте Elythia без змін у вихідному коді, введіть https://github.com/Elythia-Network/elythia"
_initialAccountSetting:
  youCanContinueTutorial: "Ви можете продовжити посібник по тому, як використовувати {name} (Elythia), або ви можете закінчити посібник й відразу почати користуватися ним. "
_initialTutorial:
  _landing:
    description: "Тут ви можете ознайомитися з основами використання Elythia та його особливостями. "
  _note:
    description: "Пости у Elythia називають \"Нотатки\". Нотатки відсортовані хронологічно й  оновлюються у реальному часі."
  _timeline:
    description1: "Elythia надає декілька стрічок в залежності від того, як ви ними користуєтесь (деякі можуть бути недоступні в залежності від правил серверу)."
  _done:
    description: "Показані функції це лише мала частина. Щоб дізнатися детальніше про використання Elythia, зверніться до {link}."
_achievements:
  _types:
    _notes1:
      title: "Привіт, Elythia!"
      flavor: "Приємного часу з Elythia!"
    _login1000:
      flavor: "Дякуємо, що користуєтеся Elythia!"
