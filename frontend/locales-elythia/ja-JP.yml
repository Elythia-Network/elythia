unselectAll: "選択を解除"
_followApproval:
  title: "新しいアカウントからのフォローを制限する"
  autoAcceptDescription: "フォローを承認制にしている場合や、新しいアカウントからのフォローを制限する場合にも、あなたがフォローしている相手は自動承認します。"
  description: "指定した期間が経過していない相手からのフォローを、下で選んだ方法で扱います。既存のフォロワーには影響しません。フォローしている相手の自動承認が有効な場合、その相手は通常どおりフォローできます。"
  remoteDescription: "相手のサーバーが公開しているアカウントの作成日時からの期間で判定します。作成日時を公開していない相手は、このサーバーが初めてそのアカウントを認識してからの期間で判定します。"
  action: "期間に満たない相手からのフォローの扱い"
  actionDescription: "通知しない方法を選ぶと、短い間に大量のフォローが来ても通知が埋まりません。"
