introMisskey: "ようこそ！Elythiaは、オープンソースの分散型マイクロブログサービスです。\n「ノート」を作成して、いま起こっていることを共有したり、あなたについて皆に発信しよう📡\n「リアクション」機能で、皆のノートに素早く反応を追加することもできます👍\n新しい世界を探検しよう🚀"
poweredByMisskeyDescription: "{name}は、オープンソースのプラットフォーム<b>Elythia</b>のサーバーのひとつです。"
initialPasswordForSetupDescription: "Elythiaを自分でインストールした場合は、設定ファイルに入力したパスワードを使用してください。\nElythiaのホスティングサービスなどを使用している場合は、提供されたパスワードを使用してください。\nパスワードを設定していない場合は、空欄にしたまま続行してください。"
flagAsBotDescription: "このアカウントがプログラムによって運用される場合は、このフラグをオンにします。オンにすると、反応の連鎖を防ぐためのフラグとして他の開発者に役立ったり、Elythiaのシステム上での扱いがBotに合ったものになります。"
aboutMkGo: "Elythiaについて"
usernameTooShort: "{n}文字以上にしてください"
useSoundOnlyWhenActive: "Elythiaがアクティブな時のみサウンドを出力する"
scratchpadDescription: "スクラッチパッドは、AiScriptの実験環境を提供します。Elythiaと対話するコードの記述、実行、結果の確認ができます。"
ephemeralRelayNotes: "リレー投稿の一時保存"
enableEphemeralRelayNotes: "リレー経由の投稿を一時保存にする"
enableEphemeralRelayNotesDescription: "リレー経由でしか届かない投稿を、データベースに残さずキャッシュに置きます。誰も反応しなかった投稿は期限が来ると自動的に消えるため、データベースが肥大化しません。リアクションや返信など何らかの操作をした時点で、通常の投稿として保存されます。"
ephemeralRelayNoteTtl: "保存期間"
ephemeralRelayNoteTtlDescription: "キャッシュに置いておく時間です。これを過ぎた投稿は、誰も操作していなければ消えます。"
ephemeralRelayNotesWarning: "有効にすると、グローバルタイムラインをこの保存期間より過去に遡れなくなります。"
relayOrphanUserCleanup: "リレー由来ユーザーの整理"
enableRelayOrphanUserCleanup: "誰とも関わりのないユーザーを削除する"
enableRelayOrphanUserCleanupDescription: "リレー経由でしか見かけなかったユーザーのうち、投稿もリアクションもフォロー関係も残っていないものを毎日削除します。再び見かければ自動的に取得し直すので、表示に影響はありません。"
relayOrphanUserGraceDays: "猶予期間"
relayOrphanUserGraceDaysDescription: "最後に見かけてからこの日数が経過したユーザーが対象です。短くしすぎると、活動中のユーザーを削除しては取得し直すことを繰り返すため、7日未満は設定できません。"
relayOrphanUserCleanupInfo: "リレーを購読する前から知っているユーザーや、プロフィールを開いたことのあるユーザーは対象外です。フォロー・ブロック・ミュートしている相手も削除されません。"
sendErrorReportsDescription: "オンにすると、問題が発生したときにエラーの詳細情報がElythiaに共有され、ソフトウェアの品質向上に役立てることができます。エラー情報には、OSのバージョン、ブラウザの種類、行動履歴などが含まれます。"
mkGoUpdated: "Elythiaが更新されました！"
rateLimitCooldown: "しばらく待ってから再試行してください"
secretReentryRequired: "秘密の値を入力し直してください"
secretReentryRequiredDescription: "送り先(ホストやURLなど)を変えるときは、それと組になっているパスワードやキーも入力し直してください。保存済みの値は、新しい送り先には使いません。"
minimumUsernameLength: "ユーザー名の最小文字数"
minimumUsernameLengthDescription: "アカウント作成時に必要なユーザー名の文字数の下限を1〜20で指定します。管理者によるアカウント作成時はこの制限を受けません。また、既に存在するアカウントも影響を受けません。"
goToMisskey: "Elythiaへ"
repositoryUrlDescription: "ソースコードが公開されているリポジトリがある場合、そのURLを記入します。Elythiaを現状のまま（ソースコードにいかなる変更も加えずに）使用している場合は https://github.com/Elythia-Network/elythia と記入します。"
nightMeteorEffect: "夜空の流れ星"
nightMeteorEffectDescription: "夜（20時〜翌4時）にダークテーマを使っているとき、ときどき画面に流れ星が流れます。季節に応じた画面の演出が出ている間は流れません。"
reactableRemoteReaction: "リアクションの相乗りをできるようにする"
failedToLoadMedia: "読み込みに失敗したか、このブラウザでは表示・再生できない形式です"
