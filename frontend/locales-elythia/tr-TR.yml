introMisskey: "Hoş geldiniz! Elythia, merkezi olmayan bir açık kaynaklı mikroblog platformudur.\n“Notlar” yazarak şu anda neler olduğunu anlatabilir veya olayları başkalarıyla paylaşabilirsiniz. 📡\n“Tepkiler” ile diğer kullanıcıların notları hakkındaki duygularınızı hızlı bir şekilde ifade edebilirsiniz. 👍\nYeni bir dünya sizi bekliyor! 🚀"
poweredByMisskeyDescription: "{name}, açık kaynak platformu <b>Elythia</b> (kısaca “Elythia örneği” olarak anılır) tarafından desteklenen hizmetlerden biridir."
initialPasswordForSetupDescription: "Elythia'yı kendiniz kurduysan, yapılandırma dosyasında belirtilen şifreyi kullan.\nElythia barındırma hizmeti veya benzeri bir hizmet kullanıyorsan, orada belirtilen şifreyi kullan.\nŞifre belirlemediysen, devam etmek için boş bırak."
flagAsBotDescription: "Bu hesap bir program tarafından kontrol ediliyorsa bu seçeneği etkinleştir. Etkinleştirildiğinde, diğer geliştiriciler için bir işaret görevi görerek diğer botlarla sonsuz etkileşim zincirlerini önleyecek ve Elythia'nın iç sistemlerini bu hesabı bir bot olarak ele alacak şekilde ayarlayacak."
useSoundOnlyWhenActive: "Elythia etkin olduğunda ses çıkarılır."
scratchpadDescription: "Scratchpad, AiScript deneyleri için bir ortam sağlar. Elythia ile etkileşim halindeyken yazabilir, çalıştırabilir ve sonuçlarını kontrol edebilirsin."
needToRestartServerToApply: "Değişikliğin yansıtılması için Elythia'nın yeniden başlatılması gerekir."
sendErrorReportsDescription: "Etkinleştirildiğinde, bir sorun oluştuğunda ayrıntılı hata bilgileri Elythia ile paylaşılacak ve bu da Elythia'nın kalitesinin iyileştirilmesine yardımcı olacak.\nBu bilgiler arasında işletim sisteminizin sürümü, kullandığınız tarayıcı, Elythia'daki faaliyetlerin vb. yer alacaktır."
goToMisskey: "Elythia'ya"
repositoryUrlDescription: "Elythia'yı olduğu gibi kullanıyorsanız (kaynak kodunda herhangi bir değişiklik yapmadan), https://github.com/Elythia-Network/elythia adresini girin."
_initialAccountSetting:
  youCanContinueTutorial: "{name} (Elythia) öğreticisine geçebilir veya buradan kurulumu sonlandırıp hemen kullanabilirsin."
