  _landing:
    description: "Burada, Elythia'yı kullanmanın temellerini ve özelliklerini öğrenebilirsin."
  _note:
    description: "Elythia'daki gönderiler “Notlar” olarak adlandırılır. Notlar panoda kronolojik olarak düzenlenir ve gerçek zamanlı olarak güncellenir."
  _timeline:
    description1: "Elythia, kullanıma göre birden fazla Pano sunar (Bazı Pano'lar sunucunun politikalarına bağlı olarak kullanılamayabilir)."
  _postNote:
    description1: "Elythia'da not yayınlarken çeşitli seçenekler mevcuttur. Yayınlama formu şu şekildedir."
  _done:
    description: "Burada tanıtılan işlevler sadece küçük bir kısmıdır. Elythia'yı kullanma konusunda daha ayrıntılı bilgi için lütfen şu kaynağa bakın: {link}."
