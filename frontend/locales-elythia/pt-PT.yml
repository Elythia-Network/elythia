  _landing:
    description: "Aqui, você pode aprender o básico de como usar o Elythia e as suas funções."
  _note:
    description: "Publicações no Elythia chamam-se 'Notas'. Notas são organizadas cronologicamente na linha do tempo e atualizam em tempo real."
  _timeline:
    description1: "Elythia providencia diversas linhas do tempo baseadas na sua utilidade (algumas podem não estar disponíveis a partir das configurações da instância)."
  _postNote:
    description1: "Ao postar uma nota no Elythia, diversas opções estão disponíveis. A ficha de publicação parece com isto: "
  _done:
    description: "As funções apresentadas aqui são apenas uma pequena parte. Para um conhecimento mais detalhado do uso do Elythia, acesse {link}."
