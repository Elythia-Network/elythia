introMisskey: "Bem-vindo! O Elythia é um serviço de microblog descentralizado de código aberto.\nCrie \"notas\" para compartilhar o que está acontecendo agora ou para se expressar com todos à sua volta 📡\nVocê também pode adicionar rapidamente reações às notas de outras pessoas usando a função \"Reações\" 👍\nVamos explorar um novo mundo 🚀"
poweredByMisskeyDescription: "{name} é uma instância da plataforma de código aberto <b>Elythia</b>."
initialPasswordForSetupDescription: "Use a senha configurada no arquivo de configuração se você instalou o Elythia manualmente.\nSe você estiver utilizando um serviço de hospedagem, utilize a senha fornecida.\nSe uma senha não foi configurada, deixe em branco e continue."
flagAsBotDescription: "Se esta conta for operada por uma aplicação, ative esta opção. Ao ativá-la, ela servirá como um sinalizador para evitar reações em cadeia e ajudar outros desenvolvedores. Além disso, ajustará o tratamento da conta no sistema do Elythia para que se adeque a um Bot."
useSoundOnlyWhenActive: "Apenas reproduzir sons quando Elythia estiver aberto."
scratchpadDescription: "O Bloco de rascunho fornece um ambiente experimental para AiScript. Permite escrever, executar e verificar os resultados do código para interagir com o Elythia."
sendErrorReportsDescription: "Ao ativar essa opção, informações detalhadas de erro serão compartilhadas com o Elythia em caso de problemas, o que pode ajudar a melhorar a qualidade do software. As informações de erro podem incluir a versão do sistema operacional, o tipo de navegador e o sua atividade no Elythia."
goToMisskey: "Ao Elythia"
repositoryUrlDescription: "Se você estiver utilizando Elythia como está (sem mudanças no código-fonte), insira https://github.com/Elythia-Network/elythia"
_initialAccountSetting:
  youCanContinueTutorial: "Você pode iniciar um tutorial de como utilizar {name} (Elythia) ou pode sair da configuração e começar o uso imediatamente."
