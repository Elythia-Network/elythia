introMisskey: "Selamat datang! Elythia adalah perangkat mikroblog tercatu bersifat sumber terbuka.\nMulailah menuliskan catatan, bagikan peristiwa terkini, serta ceritakan segala tentangmu.📡\nTunjukkan juga reaksimu pada catatan pengguna lain.👍\nMari jelajahi dunia baru🚀"
poweredByMisskeyDescription: "{name} adalah sebuah layanan (instance) yang menggunakan platform sumber terbuka <b>Elythia</b>."
initialPasswordForSetupDescription: "Jika Anda memasang Elythia sendiri, gunakan kata sandi yang Anda masukkan di berkas konfigurasi.\nJika Anda menggunakan layanan hosting Elythia, gunakan kata sandi yang diberikan.\nJika Anda belum mengatur kata sandi, biarkan kosong dan lanjutkan."
flagAsBotDescription: "Jika akun ini dikendalikan oleh program, tetapkanlah opsi ini. Jika diaktifkan, ini akan berfungsi sebagai tanda bagi pengembang lain untuk mencegah interaksi berantai dengan bot lain dan menyesuaikan sistem internal Elythia untuk memperlakukan akun ini sebagai bot."
useSoundOnlyWhenActive: "Hanya keluarkan suara jika Elythia sedang aktif"
scratchpadDescription: "Scratchpad menyediakan lingkungan eksperimen untuk AiScript. Kamu  bisa menulis, mengeksuksi, serta mengecek hasil yang berinteraksi dengan Elythia."
needToRestartServerToApply: "Perlu memulai ulang Elythia untuk memunculkan pengubahan."
sendErrorReportsDescription: "Ketika dinyalakan, informasi kesalahan rinci akan dibagikan dengan Elythia ketika masalah terjadi, hal ini untuk membantu kualitas Elythia. Fitur ini memungkinkan memuat informasi seperti sistem operasi yang kamu gunakan dan versinya, aplikasi peramban yang kamu gunakan, riwayat aktivitas kamu, dll."
goToMisskey: "Ke Elythia"
repositoryUrlDescription: "Jika kamu menggunakan Elythia begitu saja (tanpa ada perubahan dalam kode sumber), masukkan https://github.com/Elythia-Network/elythia"
_initialAccountSetting:
  youCanContinueTutorial: "Kamu dapat menjutkan ke tutorial dalam bagaimana menggunakan {name} (Elythia) atau kamu dapat keluar dari pemasangan ini dan langsung menggunakannya segera."
_initialTutorial:
  _landing:
    description: "Di sini kamu dapat mempelajari dasar-dasar dari penggunaan Elythia dan fitur-fiturnya."
  _note:
    description: "Postingan di Elythia disebut sebagai 'Catatan'. Catatan ditampilkan secara kronologis pada lini masa dan dimutakhirkan secara real-time."
  _timeline:
    description1: "Elythia menyediakan berbagai lini masa sesuai dengan penggunaan (beberapa mungkin tidak tersedia karena bergantung dengan kebijakan peladen)."
  _postNote:
    description1: "Ketika memposting catatan ke Elythia, terdapat beberapa opsi yang tersedia. Form posting terlihat seperti ini."
  _done:
    description: "Fungsi yang diperkenalkan di sini merupakan sebagian kecil dari fitur yang ada. Untuk pemahaman lebih detil dalam menggunakan Elythia, kamu dapat merujuk ke {link}."
_achievements:
  _types:
    _notes1:
      title: "Cus, baru gabung Elythia nih!"
      flavor: "Selamat bersenang-senang dengan Elythia!"
    _login1000:
      flavor: "Terima kasih telah menggunakan Elythia!"
    _client30min:
      description: "Habiskan waktu 30 menit di Elythia"
    _client60min:
      description: "Biarkan Elythia tetap terbuka setidaknya selama 60 menit"
    _tutorialCompleted:
      title: "Ijazah Sekolah Dasar Elythia"
_role:
  _options:
    maxFileSize_caption2: "Ukuran berkas maksimal di keseluruhan peladen adalah {max}. Untuk memperbolehkan unggahan berkas yang lebih besar dari ini, silahkan mengubah pengaturan ini di dalam berkas pengaturan Elythia."
_soundSettings:
  driveFileDurationWarnDescription: "Audio panjang dapat mengganggu penggunaan Elythia. Masih ingin melanjutkan?"
_urlPreviewSetting:
  summaryProxyDescription: "Bukan untuk Elythia, namun untuk menghasilkan pratinjau menggunakan Summaly Proxy."
