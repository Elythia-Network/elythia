introMisskey: "Добро пожаловать! Elythia — это децентрализованный сервис микроблогов с открытым исходным кодом.\nПишите «заметки» — делитесь со всеми происходящим вокруг или рассказывайте о себе 📡\nСтавьте «реакции» — выражайте свои чувства и эмоции от заметок других 👍\nОткройте для себя новый мир 🚀"
poweredByMisskeyDescription: "{name} – один из инстансов (также называемый экземпляром Elythia), использующий платформу с открытым исходным кодом <b>Elythia</b>."
initialPasswordForSetupDescription: "Если вы установили Elythia самостоятельно, используйте пароль, который вы указали в файле конфигурации.\nЕсли вы используете что-то вроде хостинга Elythia, используйте предоставленный пароль.\nЕсли вы не установили пароль, оставьте его пустым и продолжайте."
flagAsBotDescription: "Включите, если этот аккаунт управляется программой. Это позволит системе Elythia учитывать это, а также поможет разработчикам других ботов предотвратить бесконечные циклы взаимодействия."
useSoundOnlyWhenActive: "Воспроизводить звук только когда Elythia активен."
scratchpadDescription: "«Когтеточка» — это место для опытов с AiScript. Здесь можно писать программы, взаимодействующие с Elythia, запускать и смотреть что из этого получается."
sendErrorReportsDescription: "Если включено, когда возникнет какая-нибудь техническая проблема, подробные сведения об этом будут отправлены разработчикам Elythia. Это очень помогает делать программу лучше. В отчёты попадают тип и версия ОС, браузера, журнал действий (что привело к сбою) и тому подобное."
goToMisskey: "К Elythia"
repositoryUrlDescription: "Если вы используете Elythia как есть (без изменений в исходном коде), введите https://github.com/Elythia-Network/elythia"
_initialAccountSetting:
  youCanContinueTutorial: "Вы можете продолжить туториал по тому как пользоваться {name} (Elythia), или вы можете сразу перейти к его использованию."
_initialTutorial:
  _landing:
    description: "Здесь вы можете изучить основы пользования Elythia и его особенностями."
  _note:
    description: "Посты в Elythia называются 'Заметками.' Заметки отсортированы в хронологическом порядке в ленте и обновляются в режиме реального времени."
  _timeline:
    description1: "Elythia предоставляет несколько лент в зависимости от того как вы им пользуетесь (некоторые могут быть недоступны в зависимости от правил сервера)."
  _postNote:
    description1: "Когда вы публикуете заметку на Elythia, вы можете изменить некоторые настройки. Окно написания заметки выглядит вот так."
  _done:
    description: "Вещи показанные тут это лишь малая часть. Для более детального понимания Elythia загляните в {link}."
_achievements:
  _types:
    _notes1:
      title: "Первые шаги в Elythia"
      flavor: "Приятных дней с Elythia!"
    _login1000:
      flavor: "Спасибо, что пользуетесь Elythia!"
    _client60min:
      description: "Elythia был открыт 60 минут подряд"
    _tutorialCompleted:
      title: "Диплом начального курса Elythia"
