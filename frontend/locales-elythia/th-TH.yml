introMisskey: "ยินดีต้อนรับทุกคนจ้า! Elythia คือ ซอฟต์แวร์โอเพนซอร์สสำหรับบริการไมโครบล็อกกิ้ง (MicroBlogging) แบบกระจายศูนย์อำนาจ (Decentralized) \n\nเขียน “โน้ต (Note)” เพื่อส่งต่อเรื่องราวของคุณให้ทั้งโลกได้รับรู้📡\nและอย่าลืมที่จะ “รีแอคชั่น” กับเรื่องราวของคนอื่น ๆ ด้วยนะ! 👍\n\nท่องสำรวจโลกใบใหม่กันเถอะ🚀"
poweredByMisskeyDescription: "{name} เป็นหนึ่งในเซิร์ฟเวอร์ของแพลตฟอร์มโอเพ่นซอร์ส <b>Elythia</b>"
initialPasswordForSetupDescription: "ถ้าหากคุณติดตั้ง Elythia เอง ให้ใช้รหัสผ่านที่คุณป้อนในไฟล์กำหนดค่า \nถ้าหากคุณกำลังใช้บริการโฮสต์ Elythia ให้ใช้รหัสผ่านที่ได้รับมา\nถ้ายังไม่มีรหัสผ่าน ให้ข้ามช่องรหัสผ่านไป แล้วกดต่อไป"
flagAsBotDescription: "เปิดใช้งานตัวเลือกนี้หากบัญชีนี้ถูกควบคุมโดยโปรแกรม เมื่อเปิดใช้งาน มันจะทำหน้าที่เป็นแฟล็กสำหรับนักพัฒนารายอื่นในการป้องกันการสร้างห่วงโซ่การโต้ตอบแบบอนันต์กับบอตตัวอื่น และปรับระบบภายในของ Elythia เพื่อจัดการบัญชีนี้ในฐานะบอต"
useSoundOnlyWhenActive: "มีเสียงออกเฉพาะตอนกำลังใช้ Elythia อยู่เท่านั้น"
scratchpadDescription: "Scratchpad ให้สภาพแวดล้อมสำหรับการทดลอง AiScript คุณสามารถเขียนโค้ด/สั่งดำเนินการ/ตรวจสอบผลลัพธ์ ของการโต้ตอบกับ Elythia ได้"
sendErrorReportsDescription: "เมื่อเปิดใช้งาน การแจ้งข้อผิดพลาดจะถูกแชร์กับ Elythia เมื่อเกิดปัญหา ซึ่งช่วยในการปรับปรุงคุณภาพของซอฟต์แวร์ ข้อมูลข้อผิดพลาดอาจรวมถึงเวอร์ชันของระบบปฏิบัติการ ประเภทของเบราว์เซอร์ และประวัติการใช้งาน ฯลฯ"
goToMisskey: "ถึง Elythia"
repositoryUrlDescription: "หากมีที่เก็บซอร์สโค้ดที่เปิดเผยต่อสาธารณะ ให้ป้อน URL ที่เก็บซอร์สโค้ดนั้น แต่หากคุณใช้ Elythia ตามต้นฉบับ (ไม่มีการเปลี่ยนแปลงซอร์สโค้ด) ให้ป้อน https://github.com/Elythia-Network/elythia"
_initialAccountSetting:
  youCanContinueTutorial: "คุณสามารถดำเนินการต่อด้วยบทช่วยสอนเกี่ยวกับวิธีใช้ {name} (Elythia) หรือออกจากบทช่วยสอนแล้วเริ่มใช้งานได้ทันที"
_initialTutorial:
  _landing:
    description: "คุณสามารถตรวจสอบการใช้งานและฟังก์ชั่นพื้นฐานของ Elythia ได้ที่นี่"
  _note:
    description: "โพสต์ใน Elythia เรียกว่า “โน้ต” ซึ่งจะจัดเรียงตามลำดับเวลาบนไทม์ไลน์และอัปเดตแบบเรียลไทม์"
  _timeline:
    description1: "Elythia มีหลายไทม์ไลน์ขึ้นอยู่กับวิธีการใช้งานของคุณ (บางไทม์ไลน์อาจไม่สามารถใช้ได้ขึ้นอยู่กับนโยบายของเซิร์ฟเวอร์)"
  _postNote:
    description1: "เมื่อโพสต์โน้ตบน Elythia คุณสามารถตั้งค่าตัวเลือกต่างๆ ได้ แบบฟอร์มการส่งมีลักษณะดังนี้"
  _done:
    description: "คุณสมบัติที่แนะนำในที่นี่เป็นเพียงบางส่วนเท่านั้น หากต้องการเรียนรู้เพิ่มเติมเกี่ยวกับวิธีใช้ Elythia โปรดไปที่ {link}"
_achievements:
  _types:
    _notes1:
      flavor: "ขอให้มีช่วงเวลาที่ดีกับ Elythia นะคะ!"
    _login1000:
      flavor: "ขอบคุณที่ใช้ Elythia นะ !"
    _client30min:
      description: "ใช้เวลา 30 นาทีบน Elythia"
    _client60min:
      description: "เปิด Elythia ค้างไว้แล้วอย่างน้อย 60 นาที"
    _tutorialCompleted:
      title: "ใบรับรองการสำเร็จหลักสูตร Elythia มือใหม่"
_soundSettings:
  driveFileDurationWarnDescription: "การใช้เสียงที่ยาว อาจรบกวนการใช้งาน Elythia, ต้องการดำเนินการต่อใช่ไหม?"
_urlPreviewSetting:
  summaryProxyDescription: "สร้างการแสดงตัวอย่างด้วย summary Proxy แทนที่จะใช้เนื้อหา Elythia"
_bootErrors:
  otherOption4: "เริ่มทำงาน Elythia ในโหมดปลอดภัย"
