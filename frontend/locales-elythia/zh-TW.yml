    description: "在這裡您可以查看 Elythia 的基本使用方法和功能。"
  _note:
    description: "在Elythia上發布的內容稱為「貼文」。貼文在時間軸上按時間順序排列，並即時更新。"
  _timeline:
    description1: "Elythia根據使用方式提供了多個時間軸（伺服器可能會將部份時間軸停用）。"
  _postNote:
    description1: "在Elythia上發布貼文時，可以設定各種選項。發布表單如下所示。"
  _done:
    description: "這裡介紹的功能只是其中的一小部分。要了解更多有關如何使用Elythia的資訊，請瀏覽{link}。"
