introMisskey: "Willkommen! Elythia ist eine dezentralisierte Open-Source Microblogging-Platform.\nVerfasse „Notizen“ um mitzuteilen, was gerade passiert oder um Ereignisse mit anderen zu teilen. 📡\nMit „Reaktionen“ kannst du außerdem schnell deine Gefühle über Notizen anderer Benutzer zum Ausdruck bringen. 👍\nEine neue Welt wartet auf dich! 🚀"
poweredByMisskeyDescription: "{name} ist einer der durch die Open-Source-Plattform <b>Elythia</b> betriebenen Dienste."
initialPasswordForSetupDescription: "Verwende das in der Konfigurationsdatei angegebene Passwort, wenn du Elythia selbst installiert hast.\nWenn du einen Elythia-Hostingdienst o.ä. nutzt, verwende das dort angegebene Kennwort.\nWenn du kein Passwort festgelegt hast, lasse es leer, um fortzufahren."
flagAsBotDescription: "Aktiviere diese Option, falls dieses Benutzerkonto durch ein Programm gesteuert wird. Falls aktiviert, agiert es als Flag für andere Entwickler zur Verhinderung von endlosen Kettenreaktionen mit anderen Bots und lässt Elythias interne Systeme dieses Benutzerkonto als Bot behandeln."
useSoundOnlyWhenActive: "Gebe nur Ton aus, wenn Elythia aktiv ist"
scratchpadDescription: "Die Testumgebung bietet einen Bereich für AiScript-Experimente. Dort kannst du AiScript schreiben, ausführen sowie dessen Auswirkungen auf Elythia überprüfen."
sendErrorReportsDescription: "Ist diese Option aktiviert, so werden beim Auftreten von Fehlern detaillierte Fehlerinformationen an Elythia weitergegeben, was zur Verbesserung der Qualität von Elythia beiträgt.\nEnthalten in diesen Informationen sind u.a. die Version deines Betriebssystems, welchen Browser du verwendest und ein Verlauf deiner Aktivitäten innerhalb Elythia."
goToMisskey: "Zu Elythia"
repositoryUrlDescription: "Solltest du Elythia so wie es ist verwenden (im unveränderten Quellcode), gebe Folgendes an:\nhttps://github.com/Elythia-Network/elythia"
_initialAccountSetting:
  youCanContinueTutorial: "Du kannst mit dem Tutorial von {name}(Elythia) fortfahren, oder auch abbrechen und gleich anfangen Elythia zu benutzen."
