  _note:
    description: "Beiträge auf Elythia heißen \"Notizen\". Notizen werden chronologisch in der Chronik angeordnet und in Echtzeit aktualisiert."
  _timeline:
    description1: "Elythia stellt mehrere Chroniken bereit (einige können je nach den Richtlinien des Servers nicht verfügbar sein)."
  _postNote:
    description1: "Wenn du eine Notiz auf Elythia veröffentlichst, stehen dir verschiedene Optionen zur Verfügung. Die Oberfläche sieht folgendermaßen aus."
  _done:
    description: "Die hier beschriebenen Funktionen sind nur ein kleiner Teil dessen, was Elythia zu bieten hat; um mehr darüber zu erfahren, wie du Elythia benutzen kannst, besuche bitte {link}."
