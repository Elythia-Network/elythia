introMisskey: "¡Bienvenido/a! Elythia es un servicio de microblogging descentralizado de código abierto.\nEscribe \"notas\" para compartir lo que te ocurre ahora o para contar sobre ti a todos 📡\nCon la función de \"reacciones\", puedes también añadir una reacción rápida a las notas de todos 👍\n¡Exploremos juntos un nuevo mundo! 🚀"
poweredByMisskeyDescription: "{name} es uno de los servicios (también llamado instancia) que usa la plataforma de código abierto <b>Elythia</b>"
initialPasswordForSetupDescription: "Si ha instalado Elythia usted mismo, utilice la contraseña introducida en el archivo de configuración.\nSi utiliza un servicio de alojamiento de Elythia o similar, utilice la contraseña proporcionada.\nSi no ha establecido una contraseña, déjela en blanco para continuar."
flagAsBotDescription: "Activa esta opción si la cuenta es utilizada por un programa. Si se activa, actuará como una etiqueta para otros desarrolladores para prevenir cadenas eternas de interacción con otros bots, y ajustará los sistemas internos de Elythia para tratar esta cuenta de manera acorde."
useSoundOnlyWhenActive: "Sonar solo cuando Elythia esté activo"
scratchpadDescription: "Scratchpad proporciona un entorno experimental para AiScript. Puede escribir, ejecutar y verificar los resultados que interactúan con Elythia."
sendErrorReportsDescription: "Si habilita esta opción, ayudará a mejorar la calidad de Elythia compartiendo información detallada sobre los errores cuando se produzca un problema.\nEsto incluye información como la versión de su sistema operativo, el tipo de navegador que utiliza, su historial de actividad, etc."
goToMisskey: "ir a Elythia"
repositoryUrlDescription: "Si estás usando Elythia tal cual (sin cambios en el código fuente), entra en https://github.com/Elythia-Network/elythia"
