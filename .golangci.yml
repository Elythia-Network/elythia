## golangci-lint の設定。
##
## **既定の 5 つ (errcheck / govet / ineffassign / staticcheck / unused) を土台にする。**
## `go vet` だけでは見えない層を埋めるのが目的で、linter を増やすこと自体が目的ではない。
## 足すときは、実際に出た指摘を見てから決める。
##
## **`run.tests` は既定 (= テストも解析対象) のまま。** `unused` はパッケージ全体を
## 見ないと正しく判定できないので、`tests: false` にすると「テストからしか使われない
## もの」まで未使用と報告される (実測 10 件。`run: tests: false` を足して
## `make golangci-lint`)。テストを含めたまま扱う。
version: "2"

linters:
  default: standard

  settings:
    staticcheck:
      # **`checks` は golangci-lint の既定を置き換える。** 既定は
      # `[all, -ST1000, -ST1003, -ST1016, -ST1020, -ST1021, -ST1022]` なので、
      # `[all, ...]` と書くとそこに入っていた 6 つが**黙って有効になる**
      # (本設定は ST1003 と ST1016 を意図的に有効にし、残り 4 つを書き戻している)。
      # 初版はそれに気付かず、`comments` プリセットで 369 件を抑止しながら
      # 設定側で ON にする、という循環になっていた (実測)。意図を 1 箇所に
      # 置くため、既定の無効化も明示的に書き出す。
      #
      # `ST1016` (レシーバ名の統一) と `ST1003` (命名) は**意図的に有効**。前者は
      # 実際に 2 件見つかって直し、後者は 2026-09-22 に全件直して有効化した。
      # 残り 4 つは既定どおり無効:
      #   - ST1000 (package コメントの書式) / ST1020 / ST1021 / ST1022
      #     (exported へのコメント): 日本語で背景を書く方針と噛み合わない
      #
      # **`QF*` (quickfix) と `S1016` は恒久的に無効。**
      #   - QF* は「間違い」ではなく好みのリファクタ (De Morgan の法則を
      #     適用できる / tagged switch にできるなど)。独自ゲート 21 本で
      #     「この形を禁じる」を明示している方針と混ざる
      #   - S1016 は「同じ underlying type なら構造体変換にできる」という提案
      #     だが、位置ベースになるので**片方の struct だけフィールドを並べ替えると
      #     コンパイルが通ったまま値が入れ替わる** (`FirstSeen` / `LastSeen` が
      #     どちらも time.Time で隣接している、など)。名前ベースのリテラルは
      #     その並べ替えに免疫がある
      #
      # **`ST1003` と `ST1012` は有効。** どちらも CLAUDE.md Section 5 の
      # 「略語は全て大文字」と Go の標準慣習にあたるので、好みではなく規約違反。
      # 名前を変えても wire と DB は動かないことを確認してある — `model.Meta` の
      # `SMTP*` は gorm / json タグを持ち、`config.Config` は JSON 化される経路が
      # 無く (`config_dump.go` はキーを文字列リテラルで書く)、
      # `PolicyCanSearchIPHistory` は定数「名」で値 `canSearchIpHistory` は据え置き。
      #
      # **`SA1019` (非推奨 API) も有効。** 元の 10 件は**全て移行済みで抑制は無い**
      # (導入時は `echo` の `LoggerWithConfig` 1 件を `//nolint` で残していたが、
      # `RequestLoggerWithConfig` へ移して解消した)。
      checks:
        - all
        - -QF*
        - -S1016
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022

  exclusions:
    # **既定の除外プリセットは明示的に有効化する。** 設定ファイルを置くと
    # golangci-lint はこれを自動では適用しない。
    #
    # **入れるのは `std-error-handling` だけ。** 残り 3 つは実測で無意味か有害だった:
    #   - `comments`: ST1000 / ST1020 / ST1021 / ST1022 を抑止する。上でそれらを
    #     無効にしたので要らない (入れると「設定で ON にして preset で OFF」になる)
    #   - `common-false-positives`: 中身は G103 / G204 / G304 で**すべて gosec 向け**。
    #     gosec は有効にしていないので 100% 死んでいる
    #   - `legacy`: 4 つのうち 2 つは gosec。残りは govet (unsafe.Pointer の誤用と
    #     「メソッドの signature が違う」= stdmethods) と staticcheck SA4011 で、
    #     **本物の指摘を消す方向にしか働かない**
    #
    # `std-error-handling` (EXC0001) が落とすのは
    # `(os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv`
    # だけで、**DB 書き込みやパースの戻り値には当たらない** (ルール定義を直読して確認。
    # 抑止は実測 253 件で、内訳は `*.Close` 202 / `fmt.Fprint*` 53 / `os.Remove*` 4 ほか)。
    # **ただし `.*Close` なので「書いたファイルの Close」も入る** — 書き込み後の Close は
    # flush の失敗を運ぶので、そこを見るなら個別に errcheck へ戻すこと (実測で
    # `internal/core/drive/storage.go` の `LocalStorage.Put` が該当)。
    presets:
      - std-error-handling

    rules:
      # **`tests/e2e-federation` のパッケージ名 `e2e_federation` だけ ST1003 から外す。**
      # ディレクトリ名は `tests/` の他のスイートの多数派に合わせてハイフンにした (#3373)
      # が、Go のパッケージ名にハイフンは使えないので、下線のまま残している。外部から
      # import されないテスト専用パッケージなので、`e2efederation` などへ変える実益が
      # 無い (変えるなら `package` 句 7 か所と、コメントやログの文字列 17 か所)。
      # **CI のカバレッジ閾値は ImportPath の `/e2e` で判定する** (`ci.yml` の
      # `pkg ~ /\/e2e/` で unanchored な部分一致) ので、**名前が `e2e` で
      # 始まる限り** 0% 例外は維持される (`federatione2e` のように後ろへ
      # 回すと外れて 90% になる)。
      - path: ^tests/e2e-federation/
        text: should not use underscores in package names
        linters:
          - staticcheck

issues:
  # **既定の打ち切りを外す。** golangci-lint は同一メッセージ 3 件 /
  # linter あたり 50 件で報告を**切り詰める** (0 件にするわけではないので、
  # 赤が緑になることはない)。害は「直すたびに隠れていた分が出てくる」ことで、
  # **全部直してから有効化する**という運用が成立しなくなる (実測でそうなった)。
  max-issues-per-linter: 0
  max-same-issues: 0
